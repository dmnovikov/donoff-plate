<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АВР RPCM: графики</title>
<style>
:root {
  --bg: #f4f5f8; --card: #ffffff; --text: #1d2330; --muted: #687187; --line: #e1e4ea; --soft: #f0f2f6;
  --accent: #2563eb; --ok: #15803d; --bad: #c2410c; --warn: #a16207; --cool: #0284c7;
  --t1: #2a78d6; --t2: #eb6834; --relay: #6250d6; --grid: #e9ecf1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --card: #1b2029; --text: #e3e7ee; --muted: #8b94a7; --line: #2b323e; --soft: #232a35;
    --accent: #6c9cff; --ok: #4ade80; --bad: #fb923c; --warn: #facc15; --cool: #38bdf8;
    --t1: #3987e5; --t2: #d95926; --relay: #9085e9; --grid: #262c37;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --card: #1b2029; --text: #e3e7ee; --muted: #8b94a7; --line: #2b323e; --soft: #232a35;
  --accent: #6c9cff; --ok: #4ade80; --bad: #fb923c; --warn: #facc15; --cool: #38bdf8;
  --t1: #3987e5; --t2: #d95926; --relay: #9085e9; --grid: #262c37;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; }
header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
header .meta { color: var(--muted); font-size: 13px; }
main { max-width: 1400px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; margin-bottom: 14px; }
.card.stale { filter: grayscale(1); opacity: .7; }
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.top h2 { margin: 0; font-size: 16px; flex: 1; min-width: 0; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.pill { display: inline-flex; align-items: center; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1.5px solid currentColor; white-space: nowrap; }
.pill.on { color: var(--cool); } .pill.off { color: var(--muted); } .pill.act { color: var(--ok); } .pill.bad { color: var(--bad); }
.inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 10px; }
.inp { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--soft); }
.inp.active { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); background: var(--card); }
.inp.fail { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.inp h3 { margin: 0; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inp h3 small { color: var(--muted); font-weight: 400; }
.big { font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
.big small { font-size: 16px; color: var(--muted); font-weight: 500; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; font-size: 13px; margin-top: 6px; }
.kv > span:nth-child(odd) { color: var(--muted); }
.kv > span { min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.sum { display: flex; flex-wrap: wrap; gap: 6px 28px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.sum b { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
.bad-t { color: var(--bad); font-weight: 600; }
h2.sec { font-size: 15px; margin: 4px 0 10px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
h2.sec small { color: var(--muted); font-weight: 400; font-size: 12px; }
.outs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.out { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; min-width: 0; }
.out:hover { border-color: var(--muted); }
.out.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.out.offst { background: var(--soft); }
.out.offst .w { color: var(--muted); }
.out.alarm { border-color: var(--bad); }
.out .h { display: flex; align-items: center; gap: 6px; }
.out .h b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.out .w { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.out .w small { font-size: 13px; color: var(--muted); font-weight: 500; }
.out .q { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.out .al { color: var(--bad); font-size: 12px; font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--soft); color: var(--text); font: inherit; font-size: 13px; padding: 4px 10px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.cur { background: var(--accent); color: #fff; }
.btn { padding: 3px 10px; font: inherit; font-size: 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--text); cursor: pointer; }
.box h3 { font-size: 13px; margin: 10px 0 2px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.box h3 small { color: var(--muted); font-weight: 400; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 12px; color: var(--muted); }
.legend i, .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .xh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.tip { position: absolute; top: 4px; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 2; }
.tip .tm { color: var(--muted); }
.msg { color: var(--muted); padding: 20px 0; text-align: center; font-size: 13px; }
.msg.err { color: var(--bad); }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 0 0 20px; }
</style>
</head>
<body>
<header>
  <a href="/" style="color:var(--accent);text-decoration:none;font-size:15px">← АВР и розетки</a>
  <h1 id="title">Графики</h1>
  <span class="seg" id="range"></span>
</header>
<main><div class="card box" id="charts"><div class="msg">загрузка…</div></div></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RANGES = [['15m', '15 мин'], ['30m', '30 мин'], ['1h', '1 ч'], ['6h', '6 ч'], ['24h', '24 ч'], ['7d', '7 дн']];
const q = new URLSearchParams(location.search), what = q.get('what') === 'outlet' ? 'outlet' : 'ats', n = q.get('n') || '';
let range = q.get('range') || '30m', hist = null, timer = 0;
$('title').textContent = what === 'outlet' ? `Розетка ${n}` : 'АВР: вводы';
document.title = $('title').textContent + ' — графики';
function segs() {
  $('range').innerHTML = RANGES.map(([k, t]) => `<button data-r="${k}"${k === range ? ' class="cur"' : ''}>${t}</button>`).join('');
}
$('range').onclick = e => { const b = e.target.closest('button'); if (!b) return; range = b.dataset.r; q.set('range', range); history.replaceState(null, '', '?' + q); segs(); load(); };
segs();
async function load() {
  clearTimeout(timer);
  if (!document.hidden) {
    try {
      const r = await fetch('/api/history?' + new URLSearchParams({ what, n, range }), { cache: 'no-store' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.statusText);
      hist = j; draw();
    } catch (e) { $('charts').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  }
  timer = setTimeout(load, ['15m', '30m', '1h'].includes(range) ? 15000 : 60000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
window.addEventListener('resize', () => hist && draw());
const ser = k => (hist.series.find(s => s.key === k) || { pts: [] }).pts;
const block = (title, items) => `<h3>${title}</h3>` + (items.length > 1 ? `<div class="legend">${items.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '');
function draw() {
  const h = hist, o = { from: h.from, to: h.to, step: h.step, long: h.to - h.from > 86400 * 1.5 };
  if (what === 'ats') {
    const two = k => [{ name: 'ввод 1', color: 'var(--t1)', pts: ser('in1.' + k) }, { name: 'ввод 2', color: 'var(--t2)', pts: ser('in2.' + k) }].filter(s => s.pts.length);
    const v = two('v'), hz = two('hz'), w = two('w'), act = [{ name: 'активный ввод', color: 'var(--relay)', pts: ser('ats.active') }].filter(s => s.pts.length);
    if (!v.length && !w.length && !act.length) { $('charts').innerHTML = '<div class="msg">данных пока нет: точки пишутся раз в 10 с</div>'; return; }
    $('charts').innerHTML = block('Активный ввод <small>от какого ввода работает нагрузка</small>', act) + '<div class="chart" id="ca"></div>'
      + block('Напряжение, В', v) + '<div class="chart" id="cv"></div>'
      + block('Частота, Гц', hz) + '<div class="chart" id="ch"></div>'
      + block('Мощность, Вт', w) + '<div class="chart" id="cw"></div>';
    chart($('ca'), act, { ...o, h: 110, unit: '', dec: 0, y0: 0.6, y1: 2.4, ticks: [1, 2], state: true, tipFmt: v => 'ввод ' + Math.round(v) });
    chart($('cv'), v, { ...o, h: 220, unit: ' В', dec: 0, minSpan: 10 });
    chart($('ch'), hz, { ...o, h: 160, unit: ' Гц', dec: 2, minSpan: 0.2 });
    chart($('cw'), w, { ...o, h: 180, unit: ' Вт', dec: 0, minSpan: 5 });
  } else {
    // the voltage and the frequency on the outlet: those of the input active at that time
    const act = ser('ats.active'), onIn = k => {
      const a = ser('in1.' + k), b = ser('in2.' + k), mb = new Map(b.map(p => [p[0], p[1]]));
      let j = 0;
      return a.map(p => {
        while (j + 1 < act.length && Math.abs(act[j + 1][0] - p[0]) <= Math.abs(act[j][0] - p[0])) j++;
        const which = act.length ? Math.round(act[j][1]) : 1;
        return which === 2 && mb.has(p[0]) ? [p[0], mb.get(p[0])] : [p[0], p[1]];
      });
    };
    const a = [{ name: 'ток', color: 'var(--t2)', pts: ser(`out${n}.ma`) }].filter(s => s.pts.length);
    const w = [{ name: 'активная, Вт', color: 'var(--t1)', pts: ser(`out${n}.w`) }, { name: 'полная, ВА', color: 'var(--t2)', pts: ser(`out${n}.va`) },
      { name: 'реактивная, вар', color: 'var(--relay)', pts: ser(`out${n}.var`) }].filter(s => s.pts.length);
    const v = [{ name: 'напряжение', color: 'var(--t1)', pts: onIn('v') }].filter(s => s.pts.length);
    const hz = [{ name: 'частота', color: 'var(--t2)', pts: onIn('hz') }].filter(s => s.pts.length);
    if (!a.length && !w.length) { $('charts').innerHTML = '<div class="msg">данных пока нет</div>'; return; }
    $('charts').innerHTML = block('Ток, мА', a) + '<div class="chart" id="oa"></div>'
      + block('Мощность', w) + '<div class="chart" id="ow"></div>'
      + block('Напряжение, В <small>на активном вводе: у розеток RPCM своего замера нет</small>', v) + '<div class="chart" id="ov"></div>'
      + block('Частота, Гц <small>на активном вводе</small>', hz) + '<div class="chart" id="oh"></div>';
    chart($('oa'), a, { ...o, h: 200, unit: ' мА', dec: 0, minSpan: 20 });
    chart($('ow'), w, { ...o, h: 200, unit: '', dec: 1, minSpan: 5 });
    chart($('ov'), v, { ...o, h: 160, unit: ' В', dec: 0, minSpan: 10 });
    chart($('oh'), hz, { ...o, h: 140, unit: ' Гц', dec: 2, minSpan: 0.2 });
  }
}
// ---------- the chart (as in the donoff panel: plain SVG) ----------
const fmtT = (t, long, sec) => new Date(t * 1000).toLocaleString('ru-RU', long
  ? { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }
  : sec ? { hour: '2-digit', minute: '2-digit', second: '2-digit' } : { hour: '2-digit', minute: '2-digit' });
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw)), st = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw);
  const out = []; for (let v = Math.ceil(lo / st - 1e-9) * st; v <= hi + 1e-9; v += st) out.push(+v.toFixed(6)); return out;
}
function timeTicks(from, to, width) {
  const want = Math.max(2, Math.floor(width / 80)), opts = [60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 604800];
  const st = opts.find(x => (to - from) / x <= want) || 604800;
  const off = new Date().getTimezoneOffset() * 60, out = [];
  for (let t = Math.ceil((from - off) / st) * st + off; t <= to; t += st) out.push(t);
  return out;
}
function tickLabel(t) { const d = new Date(t * 1000); return d.getHours() || d.getMinutes() ? fmtT(t) : d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }); }
function chart(box, series, o) {
  const all = series.flatMap(s => s.pts.map(p => p[1]));
  if (!all.length) { box.innerHTML = '<div class="msg">нет данных</div>'; return; }
  const W = Math.max(260, box.clientWidth), H = o.h, L = 44, R = 10, T = 8, B = 22;
  let y0 = o.y0, y1 = o.y1;
  if (y0 === undefined) {
    y0 = Math.min(...all); y1 = Math.max(...all);
    const mid = (y0 + y1) / 2, span = Math.max(y1 - y0, o.minSpan ?? 1);
    y0 = mid - span * 0.6; y1 = mid + span * 0.6;
    if (Math.min(...all) >= 0 && y0 < 0) { y1 -= y0; y0 = 0; }
  }
  const x = t => L + (t - o.from) / (o.to - o.from) * (W - L - R), y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const yt = o.ticks || niceTicks(y0, y1, 4), xt = timeTicks(o.from, o.to, W - L - R);
  const ydec = o.ticks ? 0 : Math.max(0, Math.min(2, -Math.floor(Math.log10((yt[1] - yt[0]) || 1) + 1e-9)));
  let g = '';
  for (const v of yt) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(ydec)}</text>`;
  for (const t of xt) g += `<text x="${x(t)}" y="${H - 6}" text-anchor="middle">${tickLabel(t)}</text>`;
  for (const s of series) {
    const sgs = []; let cur = [];
    for (const p of s.pts) { if (cur.length && p[0] - cur[cur.length - 1][0] > o.step * 2.5) { sgs.push(cur); cur = []; } cur.push(p); }
    if (cur.length) sgs.push(cur);
    for (const sg of sgs) {
      if (sg.length === 1) g += `<circle cx="${x(sg[0][0])}" cy="${y(sg[0][1])}" r="2.5" fill="${s.color}"/>`;
      else if (o.state) g += `<path d="${sg.map((p, i) => `${i ? `H${x(p[0]).toFixed(1)}V` : `M${x(p[0]).toFixed(1)},`}${y(Math.round(p[1])).toFixed(1)}`).join('')}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
      else g += `<path d="${sg.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}<line class="xh" y1="${T}" y2="${H - B}" visibility="hidden"/>`
    + series.map(s => `<circle class="hd" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`).join('')
    + `<rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = box.querySelector('svg'), xh = svg.querySelector('.xh'), hds = [...svg.querySelectorAll('.hd')], tip = box.querySelector('.tip');
  const hide = () => { xh.setAttribute('visibility', 'hidden'); hds.forEach(c => c.setAttribute('visibility', 'hidden')); tip.hidden = true; };
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const t = o.from + (px - L) / (W - L - R) * (o.to - o.from);
    const near = series.map(s => { let b = null; for (const p of s.pts) if (!b || Math.abs(p[0] - t) < Math.abs(b[0] - t)) b = p; return b && Math.abs(b[0] - t) <= o.step * 2 ? b : null; });
    const first = near.find(Boolean);
    if (!first) return hide();
    xh.setAttribute('x1', x(first[0])); xh.setAttribute('x2', x(first[0])); xh.setAttribute('visibility', 'visible');
    near.forEach((b, i) => { if (b) { hds[i].setAttribute('cx', x(b[0])); hds[i].setAttribute('cy', y(b[1])); } hds[i].setAttribute('visibility', b ? 'visible' : 'hidden'); });
    const span = o.long ? `${fmtT(first[0] - o.step, true)} – ${fmtT(first[0])}` : `${fmtT(first[0] - o.step, false, o.step < 60)} – ${fmtT(first[0], false, o.step < 60)}`;
    tip.innerHTML = `<div class="tm">${span}</div>` + series.map((s, i) => near[i] ? `<div>${series.length > 1 ? `<i style="background:${s.color}"></i>${esc(s.name)}: ` : ''}<b>${o.tipFmt ? o.tipFmt(near[i][1]) : near[i][1].toFixed(o.dec) + o.unit}</b></div>` : '').join('');
    tip.hidden = false;
    const bx = x(first[0]) * r.width / W;
    tip.style.left = (bx + tip.offsetWidth + 16 > r.width ? bx - tip.offsetWidth - 10 : bx + 10) + 'px';
  });
  svg.addEventListener('pointerleave', hide);
}

load();
</script>
</body>
</html>
