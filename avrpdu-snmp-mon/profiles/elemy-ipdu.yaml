# Elemy IPDU (IPDU-1502 and the others on the PIC board): a PDU with switched outlet groups, power
# metering of the inputs, sensors and dry contacts (ELEMY-IPDU-PIC-MIB 2026-04, enterprise 58833).
# Read only here: the MIB has no writable objects.
id: elemy-ipdu
vendor: Elemy
model: IPDU
title: Elemy IPDU — PDU
kind: PDU (ПДУ)
description: |
  Блок распределения питания для стойки (IPDU-1502 и другие модели на плате PIC).
  На фазе меряет напряжение, ток, частоту, активную и реактивную мощность и энергию, следит за
  порогами мощности. Розетки собраны в группы, у каждой группы своё реле и свой автомат.
  К IPDU подключаются датчики (температура, влажность) и сухие контакты (дверь, протечка и т. п.).
  По SNMP всё только читается.
links:
  - https://elemy.ru
match: [.1.3.6.1.4.1.58833.1.4.1]

alarms:
  - {oid: .1.3.6.1.4.1.58833.1.4.1.1.1.0, ok: 0, label: нет связи с MPU}
  - {oid: .1.3.6.1.4.1.58833.1.4.1.1.2.0, label: авария}

system:
  firmware: {oid: .1.3.6.1.2.1.1.1.0, type: text}
  name:     {oid: .1.3.6.1.2.1.1.5.0, type: text}
  location: {oid: .1.3.6.1.2.1.1.6.0, type: text}
  uptime:   {oid: .1.3.6.1.2.1.1.3.0, scale: 0.01}

ats:
  title: Фаза питания
  inputs_oid: {oid: .1.3.6.1.4.1.58833.1.4.1.3.1.0}
  first: 0

input:
  v:   {oid: ".1.3.6.1.4.1.58833.1.4.1.3.2.1.5.{n}", scale: 0.01}
  ma:  {oid: ".1.3.6.1.4.1.58833.1.4.1.3.2.1.6.{n}", scale: 10}      # A x100 -> mA
  hz:  {oid: ".1.3.6.1.4.1.58833.1.4.1.3.2.1.7.{n}", scale: 0.001}
  w:   {oid: ".1.3.6.1.4.1.58833.1.4.1.3.2.1.8.{n}"}
  var: {oid: ".1.3.6.1.4.1.58833.1.4.1.3.2.1.9.{n}"}
  kwh: {oid: ".1.3.6.1.4.1.58833.1.4.1.3.2.1.10.{n}", scale: 0.001}  # Wh (its web page shows /1000 as kWh)
  alarms:
    # the state of the input: IPDU-1502 h1b3m1.1.3 does not give it (then no alarm)
    - {oid: ".1.3.6.1.4.1.58833.1.4.1.3.2.1.4.{n}", ok: 0, label: фаза не в норме}

outlets:
  title: Группы розеток
  item: группа
  count_oid: {oid: .1.3.6.1.4.1.58833.1.4.1.4.1.0}
  first: 0
  on: {oid: ".1.3.6.1.4.1.58833.1.4.1.4.2.1.4.0.{n}"}   # block 0, group n: the relay
  alarms:
    - {oid: ".1.3.6.1.4.1.58833.1.4.1.4.2.1.5.0.{n}", label: сработал автомат}

sensors:
  - title: Датчики
    count_oid: {oid: .1.3.6.1.4.1.58833.1.4.1.6.1.0}
    first: 0
    values: 2                    # a sensor gives up to 2 values (temperature and humidity)
    name:    {oid: ".1.3.6.1.4.1.58833.1.4.1.6.2.1.3.{n}.{v}", type: text}
    status:  {oid: ".1.3.6.1.4.1.58833.1.4.1.6.2.1.4.{n}.{v}", ok: 1, map: {0: отключён, 2: нет ответа, 3: ошибка чтения, 4: ошибка линии}}
    vstatus: {oid: ".1.3.6.1.4.1.58833.1.4.1.6.2.1.5.{n}.{v}", ok: 1, map: {0: нет данных, 2: ниже нормы, 3: выше нормы}}
    value:   {oid: ".1.3.6.1.4.1.58833.1.4.1.6.2.1.6.{n}.{v}", scale: 0.1}
    unit:    {oid: ".1.3.6.1.4.1.58833.1.4.1.6.2.1.7.{n}.{v}", map: {1: В, 2: кВ, 3: А, 4: кВА, 5: Вт, 6: кВт, 7: кВт·ч, 8: МВт·ч, 9: квар, 10: квар·ч, 11: Мвар·ч, 12: Ом, 13: Гц, 14: cos φ, 15: °C, 16: "%"}}
  - title: Сухие контакты
    count_oid: {oid: .1.3.6.1.4.1.58833.1.4.1.5.3.0}
    first: 0
    name:   {oid: ".1.3.6.1.4.1.58833.1.4.1.5.4.1.2.{n}", type: text}
    value:  {oid: ".1.3.6.1.4.1.58833.1.4.1.5.4.1.7.{n}", map: {0: выкл, 1: вкл}}   # the logic state
    status: {oid: ".1.3.6.1.4.1.58833.1.4.1.5.4.1.8.{n}", ok: 0, map: {1: событие, 2: авария}}
