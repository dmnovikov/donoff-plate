<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('pdu.theme') || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }</script>
<title>Автоматизация</title>
<style>
:root {
  --bg: #f4f5f8; --card: #ffffff; --text: #1d2330; --muted: #687187; --line: #e1e4ea; --soft: #f0f2f6;
  --accent: #2563eb; --ok: #15803d; --bad: #c2410c; --warn: #a16207; --cool: #0284c7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --card: #1b2029; --text: #e3e7ee; --muted: #8b94a7; --line: #2b323e; --soft: #232a35;
    --accent: #6c9cff; --ok: #4ade80; --bad: #fb923c; --warn: #facc15; --cool: #38bdf8;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --card: #1b2029; --text: #e3e7ee; --muted: #8b94a7; --line: #2b323e; --soft: #232a35;
  --accent: #6c9cff; --ok: #4ade80; --bad: #fb923c; --warn: #facc15; --cool: #38bdf8;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; }
header h1 { font-size: 18px; margin: 0; }
header .meta { color: var(--muted); font-size: 13px; }
header .back { color: var(--accent); text-decoration: none; font-size: 13px; }
main { flex: 1 0 auto; width: 100%; max-width: 1000px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 12px; align-items: start; margin-bottom: 14px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.tile.run { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
.tile h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.tile h3 span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pill { display: inline-flex; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1.5px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); } .pill.off { color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; margin-top: 10px; }
.kv > span:nth-child(odd) { color: var(--muted); }
.kv > span { min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.orow { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sbtn { margin-left: auto; padding: 1px 10px; font: inherit; font-size: 12px; font-weight: 600; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--text); cursor: pointer; }
.sbtn:hover { border-color: var(--muted); }
.sbtn:disabled { opacity: .35; cursor: default; }
.kv > span.orow { display: flex; }
.jr { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.jh { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.jh small { color: var(--muted); font-weight: 400; }
.jh button { margin-left: auto; border: 0; background: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
.jl.all { max-height: 360px; overflow-y: auto; }
.je { padding: 5px 0; border-top: 1px dashed var(--line); font-size: 12px; }
.je:first-child { border-top: 0; }
.je .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.je .l1 b { font-size: 13px; }
.je .l1 .t { color: var(--muted); }
.je .l1 .pill { margin-left: auto; }
.je .l2 { color: var(--muted); overflow-wrap: anywhere; }
.je .l2 .warn { color: var(--bad); font-weight: 600; }
.jnone { color: var(--muted); font-size: 12px; }
.why { margin: 10px 0 0; padding-left: 18px; color: var(--bad); font-size: 13px; }
.timer { font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 10px 0 0; }
.timer small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 8px; }
.act { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.act label { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.act input { width: 70px; font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); color: var(--text); }
.btn { padding: 6px 16px; font: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); color: var(--text); cursor: pointer; }
.btn.go { border-color: var(--ok); color: var(--ok); }
.btn.stop { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .35; cursor: default; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; min-height: 1em; }
.tbl { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; border-top: 0; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td .warn { color: var(--bad); font-weight: 600; }
.msg { color: var(--muted); padding: 20px 0; text-align: center; font-size: 13px; }
.msg.err { color: var(--bad); }
.note { color: var(--muted); font-size: 13px; margin: 0; }
footer { flex: none; color: var(--muted); font-size: 12px; text-align: center; padding: 10px 16px 12px; border-top: 1px solid var(--line); background: var(--card); }
footer .by { margin-top: 2px; font-size: 11px; letter-spacing: .02em; }
.ubar { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.ubar #uname { display: inline-flex; align-items: center; gap: 8px; }
.ubtn { padding: 2px 9px; font: inherit; font-size: 13px; line-height: 1.5; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--text); cursor: pointer; }
.ubtn:hover { border-color: var(--muted); }
.napi { display: inline-flex; align-items: center; color: var(--text); text-decoration: none; flex: none; }
.napi svg { height: 26px; width: auto; display: block; }
</style>
</head>
<body>
<header>
  <h1>Автоматизация</h1>
  <a class="back" href="/">‹ все устройства</a>
  <span class="meta" id="meta"></span>
</header>
<main>
  <div class="tiles" id="tiles"><div class="msg">загрузка…</div></div>
</main>
<footer id="foot">donoff-pdu-view</footer>
<script src="/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const RES = { running: ['идёт', 'warn'], ok: ['удалась', 'ok'], fail: ['неудачна', 'bad'], timeout: ['предел', 'bad'] };
const dur = s => { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = s - m * 60; return m ? `${m} мин ${x.toFixed(0).padStart(2, '0')} с` : `${x.toFixed(1)} с`; };
const clock = s => { s = Math.max(0, Math.floor(s)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const when = t => new Date(t).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const onOff = v => v == null ? '<span class="dot"></span>нет данных' : v ? '<span class="dot ok"></span>включена' : '<span class="dot"></span>выключена';
let D = null, skew = 0, busy = false, timer = null;
const limits = {};
try { Object.assign(limits, JSON.parse(localStorage.getItem('pdu.drillMax') || '{}')); } catch (e) {}

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// manual switch of an outlet of the drill: the same /api/outlet as on the device page (its pace guard too)
const swBtn = (ref, on) => on == null ? '' : `<button class="sbtn" data-dev="${esc(ref.dev)}" data-n="${ref.outlet}" data-on="${on ? 0 : 1}">${on ? 'Выкл' : 'Вкл'}</button>`;

// the journal of one automation, in its tile: the last few, all on demand
const SHOW = 5, opened = new Set();
function journal(d) {
  const L = (D.log || []).filter(r => r.drill === d.id), all = opened.has(d.id);
  const rows = (all ? L : L.slice(0, SHOW)).map(r => {
    const [t, c] = RES[r.result] || [r.result, 'off'];
    const back = (r.restore || []).map(x => x.startsWith('ВНИМАНИЕ') ? `<span class="warn">${esc(x)}</span>` : esc(x)).join(', ');
    return `<div class="je"><div class="l1"><b>${r.result === 'running' ? '…' : dur(r.seconds)}</b><span class="t">№${r.n} · ${when(r.start)} · ${esc(r.by)}</span><span class="pill ${c}">${t}</span></div>
      <div class="l2">${esc(r.reason)}${back ? ' · ' + back : ''}</div></div>`;
  }).join('');
  const more = L.length > SHOW ? `<button data-jr="${esc(d.id)}">${all ? 'свернуть' : 'весь журнал'}</button>` : '';
  return `<div class="jr"><div class="jh">Журнал <small>${L.length}</small>${more}</div>${L.length ? `<div class="jl${all ? ' all' : ''}">${rows}</div>` : '<div class="jnone">записей нет</div>'}</div>`;
}

function tile(d) {
  const run = d.run, ready = !d.why.length;
  const st = run ? ['идёт', 'warn'] : ready ? ['готова', 'ok'] : ['не готова', 'off'];
  const ins = (d.inputs || []).map(i => `<span>ввод ${i.n} ${esc(d.ats)}</span><span><span class="dot ${i.present ? 'ok' : 'bad'}"></span>${i.present ? Math.round(i.v) + ' В' : 'нет'}</span>`).join('');
  let body = `<div class="kv">${ins}
    <span>розетка ${d.start.outlet} ${esc(d.start.dev)}</span><span class="orow">${onOff(d.start_on)} <small>· старт</small>${swBtn(d.start, d.start_on)}</span>
    <span>розетка ${d.ups.outlet} ${esc(d.ups.dev)}</span><span class="orow">${onOff(d.ups_on)} <small>· «ИБП»</small>${swBtn(d.ups, d.ups_on)}</span>
    <span>предел</span><span>${run ? dur(run.max_min * 60) : Math.round(d.max_min) + ' мин по умолчанию'}</span></div>`;
  if (run) {
    const el = (Date.now() + skew - new Date(run.start)) / 1000;
    body += `<div class="timer" data-start="${esc(run.start)}">${clock(el)}<small>ждём пропажи ввода · запустил ${esc(run.by)}</small></div>
      <div class="act"><button class="btn stop" data-stop="${esc(d.id)}">Стоп</button><span class="note">Стоп — тренировка неудачна, розетки вернутся.</span></div>`;
  } else {
    const mx = limits[d.id] || Math.round(d.max_min);
    body += (ready ? '' : `<ul class="why">${d.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`) +
      `<div class="act"><button class="btn go" data-go="${esc(d.id)}"${ready ? '' : ' disabled'}>Старт</button>
       <label>предел, мин <input type="number" min="1" max="1440" step="1" value="${mx}" data-max="${esc(d.id)}"></label></div>`;
  }
  return `<div class="tile${run ? ' run' : ''}"><h3><span>${esc(d.title)}</span><span class="pill ${st[1]}">${st[0]}</span></h3>${body}<div class="err" data-err="${esc(d.id)}"></div>${journal(d)}</div>`;
}

function render() {
  if (!D || busy) return;
  const errs = {};
  document.querySelectorAll('[data-err]').forEach(e => { errs[e.dataset.err] = e.textContent; });
  const focus = document.activeElement && document.activeElement.dataset.max;
  if (!focus) $('tiles').innerHTML = D.drills.length ? D.drills.map(tile).join('') : '<div class="msg">автоматизаций нет: их задают в конфиге (drills)</div>';
  document.querySelectorAll('[data-err]').forEach(e => { e.textContent = errs[e.dataset.err] || ''; });
  const n = D.drills.filter(d => d.run).length;
  $('meta').textContent = n ? 'идёт тренировка' : '';
}

async function poll() {
  clearTimeout(timer);
  try {
    const r = await fetch('/api/drills', { cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    D = j; skew = new Date(j.now) - Date.now();
    render();
  } catch (e) { $('tiles').innerHTML = '<div class="msg err"></div>'; $('tiles').firstChild.textContent = 'нет доступа: ' + e.message; }
  timer = setTimeout(poll, D && D.drills.some(d => d.run) ? 1000 : 3000);
}

setInterval(() => document.querySelectorAll('.timer[data-start]').forEach(t => {
  t.firstChild.textContent = clock((Date.now() + skew - new Date(t.dataset.start)) / 1000);
}), 250);

$('tiles').addEventListener('input', e => {
  const id = e.target.dataset.max; if (!id) return;
  limits[id] = Number(e.target.value) || 0;
  try { localStorage.setItem('pdu.drillMax', JSON.stringify(limits)); } catch (x) {}
});
$('tiles').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.jr) { const id = b.dataset.jr; opened.has(id) ? opened.delete(id) : opened.add(id); render(); return; }
  if (b.dataset.dev) {
    const dev = b.dataset.dev, n = Number(b.dataset.n), on = Number(b.dataset.on);
    const tl = b.closest('.tile'), err = tl && tl.querySelector('[data-err]');
    const run = D.drills.some(x => x.run && x.start.dev === dev && x.start.outlet === n && !on);
    if (!confirm(`${on ? 'Включить' : 'Выключить'} розетку ${n} на ${dev}?` + (run ? '\n\nИдёт тренировка: она станет неудачной.' : ''))) return;
    if (err) err.textContent = '';
    busy = true; b.disabled = true;
    try {
      const r = await fetch('/api/outlet', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dev, n, on }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || r.statusText);
    } catch (x) { if (err) err.textContent = `розетка ${n} ${dev}: ${x.message}`; }
    busy = false;
    const keep = err ? err.textContent : '', id = err && err.dataset.err;
    await poll();
    const e2 = id && document.querySelector(`[data-err="${CSS.escape(id)}"]`); if (e2 && keep) e2.textContent = keep;
    return;
  }
  const id = b.dataset.go || b.dataset.stop, d = D.drills.find(x => x.id === id);
  const err = document.querySelector(`[data-err="${CSS.escape(id)}"]`);
  err.textContent = '';
  if (b.dataset.go) {
    const mx = Number(document.querySelector(`[data-max="${CSS.escape(id)}"]`).value) || d.max_min;
    if (!confirm(`${d.title}\n\nБудет ВКЛЮЧЕНА розетка ${d.start.outlet} на ${d.start.dev}, пойдёт отсчёт.\nОтсчёт кончится, когда пропадёт ввод ${d.ats} (или через ${mx} мин).\nПосле этого розетка ${d.start.outlet} ${d.start.dev} выключится, розетка ${d.ups.outlet} ${d.ups.dev} включится.\n\nНачать?`)) return;
    busy = true; b.disabled = true;
    try { await post('/api/drill/start', { id, max_min: mx }); } catch (x) { err.textContent = x.message; }
  } else {
    if (!confirm('Остановить тренировку? Она будет записана как неудачная, розетки вернутся.')) return;
    busy = true; b.disabled = true;
    try { await post('/api/drill/stop', { id }); } catch (x) { err.textContent = x.message; }
  }
  busy = false;
  const keep = err.textContent;
  await poll();
  const e2 = document.querySelector(`[data-err="${CSS.escape(id)}"]`); if (e2 && keep) e2.textContent = keep;
});
poll();
</script>
</body>
</html>
