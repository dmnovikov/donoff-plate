<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АВР и PDU</title>
<style>
:root {
  --bg: #f4f5f8; --card: #ffffff; --text: #1d2330; --muted: #687187; --line: #e1e4ea; --soft: #f0f2f6;
  --accent: #2563eb; --ok: #15803d; --bad: #c2410c; --warn: #a16207; --cool: #0284c7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --card: #1b2029; --text: #e3e7ee; --muted: #8b94a7; --line: #2b323e; --soft: #232a35;
    --accent: #6c9cff; --ok: #4ade80; --bad: #fb923c; --warn: #facc15; --cool: #38bdf8;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --card: #1b2029; --text: #e3e7ee; --muted: #8b94a7; --line: #2b323e; --soft: #232a35;
  --accent: #6c9cff; --ok: #4ade80; --bad: #fb923c; --warn: #facc15; --cool: #38bdf8;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; }
header h1 { font-size: 18px; margin: 0; }
header .meta { color: var(--muted); font-size: 13px; }
main { flex: 1 0 auto; width: 100%; max-width: 1400px; margin: 0 auto; padding: 16px; }
.devs { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.dev { display: block; color: inherit; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.dev:hover { border-color: var(--accent); }
.dev.stale { filter: grayscale(1); opacity: .7; }
.h { display: flex; align-items: center; gap: 8px; }
.h b { flex: 1; min-width: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h .go { color: var(--accent); font-size: 22px; line-height: 1; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); } .dot.off { background: var(--muted); }
.legend { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.kind { display: inline-block; padding: 0 7px; margin-right: 6px; border-radius: 5px; background: var(--soft); border: 1px solid var(--line); color: var(--text); font-size: 12px; font-weight: 600; }
.model { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; font-size: 13px; margin-top: 8px; }
.kv > span:nth-child(odd) { color: var(--muted); }
.kv > span { min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.ins { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.in { flex: 1; min-width: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--soft); font-size: 12px; color: var(--muted); }
.in b { display: block; font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
.in.act { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); background: var(--card); }
.in.fail b { color: var(--bad); }
.pills { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; }
.pill { display: inline-flex; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1.5px solid currentColor; white-space: nowrap; }
.pill.act { color: var(--ok); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); } .pill.off { color: var(--muted); }
.msg { color: var(--muted); padding: 20px 0; text-align: center; font-size: 13px; }
.msg.err { color: var(--bad); }
footer { flex: none; color: var(--muted); font-size: 12px; text-align: center; padding: 10px 16px 12px; border-top: 1px solid var(--line); background: var(--card); }
</style>
</head>
<body>
<header>
  <h1>АВР и PDU</h1>
  <span class="meta" id="meta">подключение…</span>
  <span class="legend"><span><i class="dot ok"></i>норма</span><span><i class="dot warn"></i>авария устройства</span><span><i class="dot bad"></i>пропал ввод</span><span><i class="dot off"></i>не отвечает</span></span>
</header>
<main>
  <div class="devs" id="devs"><div class="msg">загрузка…</div></div>
</main>
<footer id="foot"></footer>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fx = (v, d) => Number(v).toFixed(d);
const fmtUp = s => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return (d ? `${d} д ` : '') + `${h} ч ${m} мин`; };
const inV = i => i.present === 1 && i.v > 0 && (!i.vmin || i.v >= i.vmin) && (!i.vmax || i.v <= i.vmax); // the voltage is there and normal
const inOK = i => i.present === 1 && i.v > 0 && (!i.vmin || i.v >= i.vmin) && (!i.vmax || i.v <= i.vmax) && !i.inverted && !(i.alarms || []).length;

function tile(s) {
  const pr = s.profile, sy = s.system, H = pr ? pr.has : {};
  const fresh = s.ok && (Date.now() - Date.parse(s.at)) < 10000;
  const outAl = s.outlets.flatMap(o => o.alarms || []), inAl = s.inputs.flatMap(i => i.alarms || []);
  const sAl = (s.sensors || []).filter(x => x.alarm).map(x => (x.name || 'датчик') + ': ' + (x.status || 'авария'));
  const alarms = [...new Set([...(s.alarms || []), ...inAl, ...outAl, ...sAl])];
  const a = s.ats, multi = H['ats.active'] && s.inputs.length > 1, onBackup = multi && a.active && a.active !== s.main;
  const ins = H.ats ? `<div class="ins">${s.inputs.map(i => {
    const act = multi ? a.active === i.n : inV(i); // one input: active while its voltage is there
    return `<div class="in${act ? ' act' : ''}${inOK(i) ? '' : ' fail'}">ввод ${i.n}${act ? ' · активен' : ''}<b>${i.present || i.v > 0 ? fx(i.v, 0) : '—'} В</b></div>`;
  }).join('')}</div>` : '';
  const outs = s.outlets, ow = outs.reduce((x, o) => x + o.w, 0);
  // the dot: grey no answer, orange an input is lost (or on the backup), yellow the device tells an alarm, green all fine
  const inLost = H.ats && (onBackup || s.inputs.some(i => !inV(i)));
  const [dc, dt] = !fresh ? ['off', 'не отвечает'] : inLost ? ['bad', 'пропал ввод'] : alarms.length ? ['warn', 'авария устройства'] : ['ok', 'норма'];
  return `<a class="dev${fresh ? '' : ' stale'}" href="/device.html?${new URLSearchParams({ dev: s.id })}">
    <div class="h"><span class="dot ${dc}" title="${dt}"></span><b title="${esc(sy.name || s.id)}">${esc(sy.name || s.id)}</b><span class="go">›</span></div>
    <div class="model">${s.kind ? `<span class="kind">${esc(s.kind)}</span>` : ''}${pr ? esc(pr.vendor + ' ' + pr.model) : 'модель не определена'}${sy.model && pr && sy.model !== pr.model ? ' · ' + esc(sy.model) : ''}</div>
    <div class="kv">
      <span>адрес</span><span>${esc(s.host)}</span>
      <span>работает</span><span>${sy.uptime_s ? fmtUp(sy.uptime_s) : '—'}</span>
      ${sy.location ? `<span>место</span><span>${esc(sy.location)}</span>` : ''}
      ${sy.firmware ? `<span>прошивка</span><span>${esc(sy.firmware)}</span>` : ''}
      ${H.outlets ? `<span>${esc((pr.outlet_title || 'Розетки').toLowerCase())}</span><span>${outs.filter(o => o.on).length} из ${outs.length} вкл${H['outlet.w'] ? ' · ' + fx(ow, 0) + ' Вт' : ''}</span>` : ''}
      ${(s.sensors || []).some(x => x.valid && !x.text && x.unit) ? `<span>датчики</span><span>${s.sensors.filter(x => x.valid && !x.text && x.unit).map(x => fx(x.value, 1) + ' ' + esc(x.unit)).join(' · ')}</span>` : ''}
      <span>id</span><span>${esc(s.id)}</span>
    </div>
    ${ins}
    <div class="pills">
      ${multi && a.active ? `<span class="pill ${onBackup ? 'bad' : 'act'}">от ввода ${a.active}${onBackup ? ' (резерв)' : ''}</span>` : ''}
      ${alarms.map(x => `<span class="pill warn">${esc(x)}</span>`).join('')}
      ${fresh ? '' : `<span class="pill bad">${esc(s.error || 'не отвечает')}</span>`}
    </div></a>`;
}

async function poll() {
  try {
    const r = await fetch('/api/devices', { cache: 'no-store' });
    const j = await r.json();
    const ds = j.devices || [];
    $('devs').innerHTML = ds.length ? ds.map(tile).join('') : '<div class="msg">устройств нет: добавьте их в конфиг</div>';
    const up = ds.filter(s => s.ok).length;
    $('meta').textContent = `${ds.length} устройств · ${up} отвечают`;
    $('foot').textContent = `donoff-pdu-view ${j.version} · опрос по SNMP` + (j.history ? ' · история в InfluxDB' : ' · без истории');
  } catch (e) { $('meta').textContent = 'нет связи со страницей: ' + e.message; }
}
poll(); setInterval(() => { if (!document.hidden) poll(); }, 3000);
</script>
</body>
</html>
