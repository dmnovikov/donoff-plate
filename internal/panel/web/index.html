<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>donoff panel</title>
<style>
:root {
  --bg: #f4f5f8; --card: #ffffff; --text: #1d2330; --muted: #687187; --line: #e1e4ea; --soft: #f0f2f6;
  --accent: #2563eb; --ok: #15803d; --bad: #c2410c; --warn: #a16207; --cool: #0284c7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --card: #1b2029; --text: #e3e7ee; --muted: #8b94a7; --line: #2b323e; --soft: #232a35;
    --accent: #6c9cff; --ok: #4ade80; --bad: #fb923c; --warn: #facc15; --cool: #38bdf8;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 12px 20px 0; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 18px; margin: 0; }
header .meta { color: var(--muted); font-size: 13px; }
header input { margin-left: auto; width: 200px; }
main { max-width: 1400px; margin: 0 auto; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card.stale { background: var(--soft); filter: grayscale(1); opacity: .75; }
.lost { margin: 2px 0 6px; font-size: 13px; color: var(--muted); }
.lost b { color: var(--text); }
.top { display: flex; align-items: center; gap: 8px; }
.top h2 { margin: 0; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.seen { color: var(--muted); font-size: 12px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.big { font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
.big small { font-size: 16px; color: var(--muted); font-weight: 500; }
.big .lbl { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; font-size: 13px; margin-top: 6px; }
.kv > span:nth-child(odd) { color: var(--muted); }
.kv > span { min-width: 0; overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; }
.relays { display: grid; gap: 6px; margin-top: 10px; }
.relay { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.relay .name { font-weight: 600; min-width: 34px; }
.pill { display: inline-flex; align-items: center; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1.5px solid currentColor; }
.pill.on { color: var(--cool); } .pill.off { color: var(--muted); }
.relay .t { color: var(--muted); font-size: 12px; }
.relay .acts { margin-left: auto; display: flex; gap: 4px; }
.btn { padding: 3px 10px; font: inherit; font-size: 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--text); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.on { color: var(--cool); border-color: var(--cool); } .btn.off { color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], input[type=search] { padding: 4px 8px; font: inherit; font-size: 13px; color: var(--text); background: var(--soft); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-size: 13px; user-select: none; }
.ctl { display: grid; gap: 8px; margin-top: 8px; }
.ctl .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ctl .row > label { color: var(--muted); font-size: 13px; width: 108px; }
.ctl input[type=number] { width: 80px; }
.ctl input[type=text] { flex: 1; }
.levels { font-size: 12px; color: var(--muted); }
.msgs { margin-top: 8px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 140px; overflow-y: auto; background: var(--soft); border-radius: 6px; padding: 4px 8px; }
.msgs div { white-space: pre-wrap; overflow-wrap: anywhere; }
.msgs .tm { color: var(--muted); }
.msgs .out { color: var(--accent); }
.msgs:empty { display: none; }
.con { display: flex; gap: 6px; align-items: center; }
.con .raw { flex: 1; min-width: 0; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
.last { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.4em; }
.last b { color: var(--text); font-weight: 500; }
.jl { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); max-height: 180px; overflow-y: auto; overflow-wrap: anywhere; }
.jl b { color: var(--text); font-weight: 500; }
.jl .ext { color: var(--bad, #c0392b); }
.err { color: var(--bad); font-size: 12px; min-height: 1em; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.tabs { flex-basis: 100%; display: flex; gap: 2px; overflow-x: auto; margin-bottom: -1px; scrollbar-width: thin; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 6px; max-width: 220px; padding: 7px 14px; font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; cursor: pointer; }
.tab:hover { color: var(--text); background: var(--soft); }
.tab.on { color: var(--text); font-weight: 600; background: var(--bg); border-color: var(--line); }
.tab .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .n { font-size: 11px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.tab .off { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); flex: none; }
.tab.add { font-size: 16px; padding: 4px 12px; }
.tab.arch { margin-left: auto; color: var(--muted); }
.tab.arch.on { color: var(--text); }
.tab.drop { outline: 2px dashed var(--accent); outline-offset: -3px; color: var(--text); }
.hint { color: var(--muted); padding: 30px; text-align: center; }
.gear { padding: 2px 8px; font-size: 17px; line-height: 1.3; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--text); cursor: pointer; }
.gear:hover { border-color: var(--muted); }
.sett { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: 50px 12px; overflow-y: auto; }
.sett[hidden] { display: none; }
.sett .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 480px; padding: 14px 16px; }
.sett .bh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sett h3 { margin: 0; font-size: 16px; }
.sett h4 { margin: 10px 0 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
.sett .x { border: none; background: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; }
.grow { display: flex; align-items: center; gap: 4px; padding: 6px 0; border-top: 1px solid var(--line); }
.grow .gn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .gn small { color: var(--muted); margin-left: 6px; }
.grow .btn { padding: 3px 8px; }
.grow .btn:disabled { opacity: .35; }
.sett .q { color: var(--muted); font-size: 12px; margin-top: 8px; }
.top[draggable] { cursor: grab; }
.ebtn { padding: 0 6px; font-size: 14px; line-height: 1.4; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
.ebtn:hover { border-color: var(--line); color: var(--text); }
.cmt { margin: 2px 0 4px; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.cedit { display: grid; gap: 6px; margin: 8px 0 4px; padding: 8px; background: var(--soft); border-radius: 8px; }
.cedit[hidden] { display: none; }
.cedit .row { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; }
.cedit .row > label { color: var(--muted); font-size: 13px; width: 96px; padding-top: 4px; }
.cedit input[type=text], .cedit textarea { flex: 1; min-width: 160px; }
textarea { padding: 4px 8px; font: inherit; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
.cedit .q { color: var(--muted); font-size: 12px; }
.gchips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.gchip { padding: 5px 10px; font: inherit; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
.gchip.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.group { margin-bottom: 22px; }
.group > h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
.group > h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
.mode { margin-top: 8px; font-size: 13px; }
.mode b.heat { color: var(--bad); } .mode b.cool { color: var(--cool); } .mode .q { color: var(--muted); }
.ctl .rctl { display: flex; gap: 6px; flex-wrap: wrap; }
.other { font-size: 12px; }
.mdot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); opacity: .55; flex: none; align-self: center; }
.ticon.heat { color: #ea580c; } .ticon.cool { color: #2563eb; }
.mdot.heat { background: #ea580c; opacity: 1; } .mdot.cool { background: #2563eb; opacity: 1; } .mdot.sched { background: #7c3aed; opacity: 1; } .mdot.none, .mdot.manual { background: transparent; border: 1.5px solid var(--muted); opacity: .8; box-sizing: border-box; }
.hbar { display: grid; grid-template-columns: repeat(24, 1fr); gap: 1px; margin: 2px 0 4px 19px; }
.hbar i { height: 8px; background: var(--soft); border-radius: 1px; }
.hbar i.on { background: #7c3aed; }
.hbar i.now { outline: 2px solid var(--text); outline-offset: 0; }
.hbar.big { margin: 4px 0; gap: 2px; }
.hbar.big i { height: 22px; font-style: normal; font-size: 10px; color: var(--muted); display: grid; place-items: center; cursor: default; user-select: none; }
.hbar.big i.on { color: #fff; }
.hbar.edit i { cursor: pointer; }
.hbar.edit i.chg { box-shadow: inset 0 0 0 2px #eab308; }
.hlab { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-left: 19px; }
.relay .cfg { margin-left: auto; font-variant-numeric: tabular-nums; }
.sync { font-size: 12px; } .sync.ok { color: var(--ok); } .sync.bad { color: var(--bad); }
.sch { display: grid; gap: 4px; }
.sch select { font: inherit; font-size: 13px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--text); max-width: 100%; }
.sch .q { color: var(--muted); font-size: 12px; }
.hbtn { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
.hbtn[hidden] { display: none; }
.hbtn .sp { flex: 1; min-width: 0; display: block; color: inherit; text-decoration: none; }
.hbtn svg { display: block; width: 100%; height: 38px; overflow: visible; }
.hbtn .sl { stroke: var(--accent); stroke-width: 1.6; fill: none; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.hbtn .sa { fill: var(--accent); opacity: .1; }
.hbtn .sc { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.hbtn .go { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); color: var(--text); text-decoration: none; font-size: 18px; }
.hbtn .go:hover { border-color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>donoff</h1>
  <span class="meta"><span class="dot" id="bdot"></span> <span id="broker">…</span></span>
  <span class="meta" id="count"></span>
  <input type="search" id="filter" placeholder="фильтр: имя или комментарий">
  <button class="gear" id="gear" title="настройки">⚙</button>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="sett" id="sett" hidden><div class="box">
  <div class="bh"><h3>Настройки</h3><button class="x" data-s="close" title="закрыть">×</button></div>
  <h4>Группы</h4>
  <div id="sgroups"></div>
  <div class="row" style="margin-top:8px"><button class="btn" data-s="add">+ Новая группа</button></div>
  <div class="q">Порядок здесь — порядок вкладок. Удалённая группа: её устройства станут «без группы». Переложить устройство в группу — ✎ в его карточке или перетащить карточку на вкладку.</div>
</div></div>
<main>
  <div class="hint" id="hint" hidden></div>
  <div id="groups"></div>
  <datalist id="grouplist"></datalist>
  <div class="empty" id="empty" hidden>Устройств пока нет — жду сообщений от брокера…</div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json' } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
let now = new Date();
const age = t => Math.max(0, (now - new Date(t)) / 1000);
const ago = t => { const s = Math.floor(age(t)); return s < 60 ? `${s} с` : s < 3600 ? `${Math.floor(s / 60)} мин` : s < 86400 ? `${Math.floor(s / 3600)} ч` : `${Math.floor(s / 86400)} д`; };
const hm = t => new Date(t).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

// topic kinds
const isTime = k => ['time_up', 'time_comm', 'time_down'].includes(k);
const relayKey = k => /^relays\/r\d+$/.test(k) || /^b\d+$/.test(k);
const sensorName = k => k.replace(/^sensors\//, '');
const isTemp = k => /^temp/.test(sensorName(k));
function primaryTemp(t) {
  for (const k of ['sensors/temp_out', 'temp_out', 'sensors/temp_in', 'temp_in']) if (t[k]) return [k, t[k]];
  const k = Object.keys(t).find(k => isTemp(k) && !k.endsWith('_json'));
  return k ? [k, t[k]] : null;
}
// temp_in only watches the device itself: in brackets after the main temperature, -127 means there is none
const isControlTemp = k => sensorName(k) === 'temp_in';
function controlTemp(t, pt) {
  const k = ['sensors/temp_in', 'temp_in'].find(k => t[k]);
  if (!k || (pt && pt[0] === k) || Number(t[k].v) === -127) return null;
  return t[k].v;
}
function deviceClock(t) {
  let best = null;
  for (const [k, v] of Object.entries(t)) {
    if (!v.v.startsWith('{')) continue;
    try { const j = JSON.parse(v.v); if (j.timestamp && (!best || v.at > best.at)) best = { ts: j.timestamp, at: v.at }; } catch (e) {}
  }
  return best;
}

async function send(dev, cmd, card, confirmText) {
  if (confirmText && !confirm(`${dev}: ${confirmText}\n\nКоманда: ${cmd}`)) return false;
  const err = card.querySelector('.err');
  try { await api('/api/v1/cmd', { method: 'POST', body: JSON.stringify({ dev, cmd }) }); err.textContent = ''; refresh(); return true; }
  catch (e) { err.textContent = e.message; return false; }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function askMode(id, el) { if (await send(id, 'sh hotter', el)) { await sleep(1200); send(id, 'sh cooler', el); } }

// "C=2600,D=..,N=.. dT=100" or the old EEPROM form "C=26,... dT=5": donoff-lib reads a level
// below 100 as °C and a delta below 50 as 1/10 °C, everything else as 1/100 °C
function parseLevels(text) {
  const C = +text.match(/C=(-?\d+)/)[1], dT = +text.match(/dT=(-?\d+)/)[1];
  return { c: Math.abs(C) < 100 ? C : C / 100, dt: (dT < 50 ? dT * 10 : dT) / 100 };
}

// the relay mode from the answers "hotter=N" / "cooler=N" (donoff-lib clears one when the other is set)
function relayMode(p) {
  const h = p.hotter, c = p.cooler;
  const hv = h && +h.v.split('=')[1], cv = c && +c.v.split('=')[1];
  if (h && hv > 0 && (!c || cv === 0 || h.at > c.at)) return { k: 'heat', t: 'термостат: нагрев' };
  if (c && cv > 0) return { k: 'cool', t: 'термостат: охлаждение' };
  if (h && c) return { k: 'manual', t: 'термостат не задан' };
  return null;
}

// "sh time": "I:S=1,T=17:5:2026" -> synced, the hour and the minute of the device
function devTime(p) {
  const m = p.time && p.time.v.match(/^I:S=(\d+),T=(\d+):(\d+)/);
  return m ? { synced: m[1] === '1', h: +m[2], m: +m[3], at: p.time.at } : null;
}

// the schedules of donoff-lib (lamp_modes): 24 hours, the first char is 00:00-00:59
const PRESETS = ['000000000000000000000000', '111111111111111111111111', '000000000000000000001111', '111111000000000000111111',
  '000000011111111111111110', '000001111111111111111110', '000000111100000000111110', '000011111000000000111110',
  '010101010101010101010101', '101010101010101010101010', '111111111111000000001111', '001001001001001001001001',
  '000100010001000100010001', '000010000100001000010001', '000000010000000100000001', '000000000010000000000001',
  '000000000000000000000010', '111111111110000000000011', '001111111111111000000000', '000000111100000000111111'];
const aofsNum = (p, n) => { const v = p['aofs' + n]; return v ? +v.v.split('=')[1] : null; };
const schNum = (p, n) => { const v = p['lschm' + n]; return v ? +v.v.split('=')[1] : null; };
const customBits = (p, n) => { const v = p['cschm' + n]; return v ? v.v.replace(/ /g, '') : null; };
function schBits(p, num) {
  if (num >= 1 && num <= PRESETS.length) return PRESETS[num - 1];
  if (num === 99) return customBits(p, 1);
  if (num === 100) return customBits(p, 2);
  return null;
}
function hoursText(bits) {
  if (!bits) return '';
  if (!bits.includes('1')) return 'всегда выкл';
  if (!bits.includes('0')) return 'всегда вкл';
  const out = []; let a = -1;
  for (let h = 0; h <= 24; h++) {
    if (h < 24 && bits[h] === '1') { if (a < 0) a = h; }
    else if (a >= 0) { out.push(a === h - 1 ? `${a}` : `${a}–${h - 1}`); a = -1; }
  }
  return out.length > 6 ? `${bits.split('').filter(x => x === '1').length} ч в сутки` : out.join(', ');
}
function schName(num) {
  if (num === 0) return 'выключено';
  if (num === 99) return 'своя схема 1 (cschm1)';
  if (num === 100) return 'своя схема 2 (cschm2)';
  return `пресет ${num}: ${hoursText(PRESETS[num - 1])}`;
}
function hbar(bits, now, big) {
  return `<div class="hbar${big ? ' big' : ''}">` + [...Array(24)].map((_, h) =>
    `<i class="${bits && bits[h] === '1' ? 'on' : ''}${h === now ? ' now' : ''}" data-h="${h}" title="${h}:00–${h}:59">${big ? h : ''}</i>`).join('') + '</div>';
}

// the small chart of temp_out for the last 24 h on the card, like the tiles of an exchange
const sparks = new Map(); // dev -> {at, busy}
async function spark(id, el) {
  const st = sparks.get(id) || {};
  if (st.busy || Date.now() - (st.at || 0) < 60000) return;
  sparks.set(id, { ...st, busy: true });
  try {
    const h = await api(`/api/v1/history?dev=${encodeURIComponent(id)}&range=24h`);
    // temp_out, or another temperature, or the current (sct013x3 is the sum of the three phases)
    const o = h.others || [];
    const s = h.temps.find(x => x.name === 'temp_out') || h.temps[0] || o.find(x => x.name === 'sct013x3') || o.find(x => /^sct|current/.test(x.name)) || o[0];
    const unit = !s ? '' : /^temp/.test(s.name) ? '°C' : /^sct|current/.test(s.name) ? 'А' : /power/.test(s.name) ? 'Вт' : /volt|volage/.test(s.name) ? 'В' : '';
    const box = el.querySelector('.spk'), cap = el.querySelector('.sc');
    if (!s || s.pts.length < 2) { box.innerHTML = ''; cap.innerHTML = s ? '<span>история копится…</span>' : ''; }
    else {
      const v = s.pts.map(p => p[1]), t0 = s.pts[0][0], t1 = s.pts[s.pts.length - 1][0];
      let lo = Math.min(...v), hi = Math.max(...v);
      const minSpan = unit === '°C' ? 0.5 : Math.max(Math.abs(hi + lo) / 2 * 0.05, 0.02);
      if (hi - lo < minSpan) { const m = (hi + lo) / 2; lo = m - minSpan / 2; hi = m + minSpan / 2; }
      const X = t => (t - t0) / Math.max(1, t1 - t0) * 200, Y = x => 36 - (x - lo) / (hi - lo) * 34;
      const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
      box.innerHTML = `<svg viewBox="0 0 200 38" preserveAspectRatio="none"><path class="sa" d="${d}L200,38L0,38Z"/><path class="sl" d="${d}"/></svg>`;
      const dt = v[v.length - 1] - v[0], hrs = Math.round((t1 - t0) / 3600);

    }

    c.querySelector('.cs').textContent = was ? hoursText(was) + (edits.has(id + k) ? ' → ' + hoursText(ed) + ' (не сохранено)' : '') : 'не загружена';

  const lv = P.tls;
  el.querySelector('.levels').textContent = lv
    ? (() => { const l = parseLevels(lv.v); return `Сейчас: уставка ${l.c} °C, гистерезис ${l.dt} °C (ответ ${ago(lv.at)} назад)`; })()
    : 'Текущие уставки неизвестны — панель спрашивает их раз в минуту, или «Запросить: уставки».';
  const msgs = [...d.info.filter(m => !m.auto).map(m => ({ ...m, k: 'i' })), ...d.log.map(m => ({ ...m, k: 'l' }))].sort((x, y) => x.at < y.at ? -1 : 1).slice(-12);
  const lastIn = d.info.filter(m => !m.out).slice(-1)[0];
  const lastHtml = lastIn ? `<span>${hm(lastIn.at)}</span> ← <b>${esc(lastIn.text)}</b>` : 'ответов ещё нет';
  const le = el.querySelector('.last');
  if (le.dataset.html !== lastHtml) { le.innerHTML = lastHtml; le.dataset.html = lastHtml; le.title = lastIn ? lastIn.text : ''; }
  const dm = t => new Date(t).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
  const jHtml = d.cmds.length ? d.cmds.slice().reverse().map(m => `<div>${dm(m.at)} ${hm(m.at)} <b>${esc(m.text)}</b>${m.by === 'other' ? ' <span class="ext">не панель</span>' : ''}</div>`).join('') : 'команд пока не было';
  const je = el.querySelector('.jl');
  if (je.dataset.html !== jHtml) { je.innerHTML = jHtml; je.dataset.html = jHtml; }
  const box = el.querySelector('.msgs');
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
  box.innerHTML = msgs.map(m => `<div><span class="tm">${hm(m.at)}</span> ${m.out ? `<span class="out">→ ${esc(m.text)}</span>` : (m.k === 'l' ? 'log: ' : '') + esc(m.text)}</div>`).join('');
  if (atBottom) box.scrollTop = box.scrollHeight;
  return el;
}

async function refresh() {
  let s;
  try { s = await api('/api/v1/state'); } catch (e) { $('bdot').className = 'dot bad'; $('broker').textContent = 'нет связи с панелью: ' + e.message; return; }
  now = new Date(s.now);
  $('bdot').className = 'dot ' + (s.broker.connected ? 'ok' : 'bad');
  $('broker').textContent = `${s.broker.user}@${s.broker.server}` + (s.broker.connected ? '' : ' — ' + (s.broker.error || 'подключение…'));
  groups = s.groups || {};
  comments = s.comments || {};
  hasHistory = !!s.history;
  const f = $('filter').value.trim().toLowerCase();
  const all = s.devices || [];
  const devs = all.filter(d => !f || d.id.toLowerCase().includes(f) || (comments[d.id] || '').toLowerCase().includes(f));
  const nArch = all.filter(d => groups[d.id] === ARCH).length;
  $('count').textContent = `устройств: ${all.length - nArch}` + (nArch ? `, в архиве ${nArch}` : '');
  // "Архив": old devices, a tab of its own at the end, not shown on "Все" and not counted as offline
  groupOrder = s.group_order || [];
  const oi = n => { const i = groupOrder.indexOf(n); return i < 0 ? 1e9 : i; };
  const byOrder = (x, y) => oi(x) - oi(y) || x.localeCompare(y, 'ru');
  const names = [...new Set(Object.values(groups))].filter(n => n !== ARCH).sort(byOrder);
  pending = pending.filter(n => !names.includes(n) && n !== ARCH);
  shownGroups = [...names, ...pending];
  savePending();
  $('grouplist').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
  const by = new Map(names.map(n => [n, []]));
  by.set('', []); by.set(ARCH, []);
  for (const d of devs) by.get(groups[d.id] && by.has(groups[d.id]) ? groups[d.id] : '').push(d);
  // the tabs: all, every group, the devices without a group, the groups made here and still empty, "+"
  const allBy = new Map(names.map(n => [n, []])); allBy.set('', []); allBy.set(ARCH, []);
  for (const d of all) allBy.get(groups[d.id] && allBy.has(groups[d.id]) ? groups[d.id] : '').push(d);
  groupCount = n => allBy.get(n) ? allBy.get(n).length : 0;
  if (!$('sett').hidden) fillSettings();
  const tabList = [['*', 'Все', all.filter(d => groups[d.id] !== ARCH)], ...names.map(n => [n, n, allBy.get(n)])];
  if ((names.length || nArch) && allBy.get('').length) tabList.push(['', 'Без группы', allBy.get('')]);
  for (const n of pending) tabList.push([n, n, []]);
  tabList.push([ARCH, '🗄 ' + ARCH, allBy.get(ARCH)]);
  if (all.length && !tabList.some(x => x[0] === tab)) setTab('*', false);  // a group that is gone (not before the first data)
  const tabsHtml = tabList.map(([k, label, list]) => {
    const off = k !== ARCH && list.some(d => age(d.last_seen) > 300);
    return `<button class="tab${k === tab ? ' on' : ''}${k === ARCH ? ' arch' : ''}" data-g="${esc(k)}" title="${esc(label)}"><span class="tn">${esc(label)}</span><span class="n">${list.length}</span>${off ? '<span class="off" title="есть устройства без связи"></span>' : ''}</button>`;
  }).join('') + '<button class="tab add" data-g="+" title="новая группа">+</button>';
  const tb = $('tabs');
  if (tb.dataset.html !== tabsHtml) { tb.innerHTML = tabsHtml; tb.dataset.html = tabsHtml; }
  const order = (tab === '*' ? [...names, ''] : [tab]).filter(n => by.has(n) && by.get(n).length);
  const hint = $('hint');
  hint.hidden = !(tab !== '*' && !order.length && all.length);
  if (!hint.hidden) hint.textContent = f ? 'Ничего не найдено по фильтру.' : tab === ARCH ? 'Архив пуст: сюда кладут старые устройства (✎ в карточке → «Архив», или перетащите карточку на эту вкладку). На «Все» они не показываются.' : 'В группе пока нет устройств: перетащите сюда карточку за заголовок (на вкладке «Все») или нажмите ✎ в карточке и укажите эту группу.';
  const root = $('groups');
  const wantSec = order.map(n => {
    let sec = sections.get(n);
    if (!sec) {
      sec = document.createElement('section'); sec.className = 'group';
      sec.innerHTML = '<h2><span class="gname"></span> <small></small></h2><div class="grid"></div>';
      sections.set(n, sec);
    }
    const list = by.get(n);
    sec.querySelector('h2').hidden = tab !== '*';
    sec.querySelector('.gname').textContent = n || (names.length || nArch ? 'Без группы' : 'Устройства');
    sec.querySelector('small').textContent = list.length;
    const grid = sec.querySelector('.grid');
    const want = list.map(render);
    [...grid.children].forEach(c => { if (!want.includes(c)) c.remove(); });
    want.forEach((c, i) => { if (grid.children[i] !== c) grid.insertBefore(c, grid.children[i] || null); });
    return sec;
  });
  [...root.children].forEach(c => { if (!wantSec.includes(c)) c.remove(); });
  wantSec.forEach((c, i) => { if (root.children[i] !== c) root.insertBefore(c, root.children[i] || null); });
  $('empty').hidden = all.length > 0;
}

// the open tab: in the address (#g=...) and remembered in this browser; "*" = all, "" = without a group
let tab = '*', pending = [], groupOrder = [], shownGroups = [], groupCount = () => 0;
const ARCH = 'Архив';
try { pending = JSON.parse(localStorage.getItem('donoff.pendingGroups') || '[]').filter(x => typeof x === 'string'); } catch (e) { pending = []; }
function savePending() { try { localStorage.setItem('donoff.pendingGroups', JSON.stringify(pending)); } catch (e) {} }
function setTab(t, go = true) {
  tab = t;
  try { localStorage.setItem('donoff.tab', t); } catch (e) {}
  const h = t === '*' ? '' : '#g=' + encodeURIComponent(t);
  if (location.hash !== h) history.replaceState(null, '', h || location.pathname + location.search);
  if (go) { $('tabs').dataset.html = ''; refresh(); }
}
{
  const m = location.hash.match(/^#g=(.*)$/);
  if (m) tab = decodeURIComponent(m[1]);
  else { try { tab = localStorage.getItem('donoff.tab') ?? '*'; } catch (e) {} }
}
window.addEventListener('hashchange', () => { const m = location.hash.match(/^#g=(.*)$/); setTab(m ? decodeURIComponent(m[1]) : '*'); });
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  if (b.dataset.g !== '+') return setTab(b.dataset.g);
  const n = newGroup();
  if (n) setTab(n);
});
const dropTab = e => { const b = e.target.closest && e.target.closest('.tab'); return b && b.dataset.g !== '*' && b.dataset.g !== '+' ? b : null; };
$('tabs').addEventListener('dragover', e => {
  const b = dropTab(e); if (!b || !e.dataTransfer.types.includes('text/x-dev')) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  $('tabs').querySelectorAll('.drop').forEach(x => x !== b && x.classList.remove('drop')); b.classList.add('drop');
});
$('tabs').addEventListener('dragleave', e => { const b = dropTab(e); if (b && !b.contains(e.relatedTarget)) b.classList.remove('drop'); });
$('tabs').addEventListener('drop', async e => {
  const b = dropTab(e); if (!b) return;
  e.preventDefault(); b.classList.remove('drop');
  const dev = e.dataTransfer.getData('text/x-dev'); if (!dev) return;
  try { await api('/api/v1/group', { method: 'PUT', body: JSON.stringify({ dev, group: b.dataset.g }) }); $('tabs').dataset.html = ''; refresh(); }
  catch (err) { alert(err.message); }
});
// settings (⚙): the groups — order of the tabs, rename, delete; later the users go here too
function newGroup() {
  const n = (prompt('Название новой группы (до 40 символов):') || '').trim().slice(0, 40);
  if (!n) return null;
  if (n === ARCH) { alert('«Архив» уже есть.'); return null; }
  if (!Object.values(groups).includes(n) && !pending.includes(n)) { pending.push(n); savePending(); }
  return n;
}
function fillSettings() {
  const last = shownGroups.length - 1;
  const html = shownGroups.map((n, i) => `<div class="grow" data-n="${esc(n)}"><span class="gn">${esc(n)}<small>${groupCount(n)}</small></span>`
    + `<button class="btn" data-s="up" title="левее"${i ? '' : ' disabled'}>▲</button><button class="btn" data-s="down" title="правее"${i < last ? '' : ' disabled'}>▼</button>`
    + `<button class="btn" data-s="ren" title="переименовать">✎</button><button class="btn" data-s="del" title="удалить группу">🗑</button></div>`).join('')
    + `<div class="grow"><span class="gn">🗄 ${ARCH}<small>${groupCount(ARCH)}</small></span><span class="q" style="margin:0">всегда последняя</span></div>`;
  const box = $('sgroups');
  if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html; }
}
async function groupsChanged() { $('tabs').dataset.html = ''; await refresh(); fillSettings(); }
$('gear').addEventListener('click', () => { $('sett').hidden = false; fillSettings(); });
$('sett').addEventListener('click', async e => {
  if (e.target === $('sett')) { $('sett').hidden = true; return; }
  const b = e.target.closest('[data-s]'); if (!b) return;
  const n = b.closest('.grow') ? b.closest('.grow').dataset.n : null;
  try {
    switch (b.dataset.s) {
      case 'close': $('sett').hidden = true; return;
      case 'add': if (newGroup()) await groupsChanged(); return;
      case 'up': case 'down': {
        const ord = [...shownGroups], i = ord.indexOf(n), j = i + (b.dataset.s === 'up' ? -1 : 1);
        if (i < 0 || j < 0 || j >= ord.length) return;
        [ord[i], ord[j]] = [ord[j], ord[i]];
        await api('/api/v1/group/order', { method: 'PUT', body: JSON.stringify({ order: ord }) });
        return groupsChanged();
      }
      case 'ren': {
        const to = (prompt(`Новое название группы «${n}»:`, n) || '').trim().slice(0, 40);
        if (!to || to === n) return;
        if (to === ARCH) return alert('«Архив» — особая группа, переложите устройства в неё через ✎ в карточке.');
        if (pending.includes(n)) { pending = pending.map(x => x === n ? to : x); savePending(); }
        else await api('/api/v1/group/rename', { method: 'POST', body: JSON.stringify({ from: n, to }) });
        if (tab === n) setTab(to, false);
        return groupsChanged();
      }
      case 'del': {
        const c = groupCount(n);
        if (!confirm(`Удалить группу «${n}»?` + (c ? `\n\nЕё устройства (${c}) станут «без группы».` : ''))) return;
        pending = pending.filter(x => x !== n); savePending();
        await api('/api/v1/group/delete', { method: 'POST', body: JSON.stringify({ name: n }) });
        if (tab === n) setTab('*', false);
        return groupsChanged();
      }
    }
  } catch (err) { alert(err.message); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sett').hidden) $('sett').hidden = true; });
$('filter').addEventListener('input', refresh);
refresh(); setInterval(refresh, 2000);
</script>
