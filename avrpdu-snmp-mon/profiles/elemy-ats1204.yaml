# Elemy ATS-1204: an ATS with two inputs and one output (ELEMY-ATS1204-MIB, enterprise 58833).
# Read only: the MIB has no writable objects.
id: elemy-ats1204
vendor: Elemy
model: ATS-1204
title: Elemy ATS-1204 — АВР
kind: ATS (АВР)
description: |
  Автоматический ввод резерва на два ввода и один выход.
  На каждом вводе ATS-1204 меряет напряжение и частоту, следит, в норме ли ввод (номинал ± допуск)
  и не отказало ли реле ввода. На выходе: есть ли напряжение, ток, полная, активная и реактивная
  мощность, cos φ и состояние нагрузки (норма, полная, перегрузка).
  Переключение вводов мгновенное или через ноль; приоритетный ввод можно задать. По SNMP всё только
  читается: управлять АВР по SNMP нельзя.
links:
  - https://elemy.ru
match: [.1.3.6.1.4.1.58833.1.2.2]

alarms:
  - {oid: .1.3.6.1.4.1.58833.1.2.2.1.1.0, ok: 0, label: нет связи с ядром}
  - {oid: .1.3.6.1.4.1.58833.1.2.2.1.2.0, label: авария блока питания}

system:
  firmware: {oid: .1.3.6.1.2.1.1.1.0, type: text}
  name:     {oid: .1.3.6.1.2.1.1.5.0, type: text}
  location: {oid: .1.3.6.1.2.1.1.6.0, type: text}
  uptime:   {oid: .1.3.6.1.2.1.1.3.0, scale: 0.01}

ats:
  inputs: 2
  first: 0                       # the SNMP rows are 0 and 1: inputs 1 and 2 on the page
  priority: {oid: .1.3.6.1.4.1.58833.1.2.2.3.4.0}   # 0 none, 1 or 2
  vnom:     {oid: .1.3.6.1.4.1.58833.1.2.2.3.6.0}
  vdev:     {oid: .1.3.6.1.4.1.58833.1.2.2.3.7.0}

input:
  v:       {oid: ".1.3.6.1.4.1.58833.1.2.2.3.2.1.2.{n}"}
  hz:      {oid: ".1.3.6.1.4.1.58833.1.2.2.3.2.1.3.{n}", scale: 0.01}
  present: {oid: ".1.3.6.1.4.1.58833.1.2.2.3.2.1.4.{n}"}   # the input is normal
  active:  {oid: ".1.3.6.1.4.1.58833.1.2.2.3.2.1.5.{n}"}
  alarms:
    - {oid: ".1.3.6.1.4.1.58833.1.2.2.3.2.1.6.{n}", label: авария реле}

outlets:
  title: Выход
  count_oid: {oid: .1.3.6.1.4.1.58833.1.2.2.4.1.0}
  first: 0
  on:  {oid: ".1.3.6.1.4.1.58833.1.2.2.4.2.1.2.{n}"}      # the voltage is on the output
  ma:  {oid: .1.3.6.1.4.1.58833.1.2.2.4.3.1.0, scale: 10}  # A x100 -> mA
  va:  {oid: .1.3.6.1.4.1.58833.1.2.2.4.3.2.0}
  w:   {oid: .1.3.6.1.4.1.58833.1.2.2.4.3.3.0}
  var: {oid: .1.3.6.1.4.1.58833.1.2.2.4.3.4.0}
  alarms:
    - {oid: .1.3.6.1.4.1.58833.1.2.2.4.3.7.0, yes: 1, label: полная нагрузка}
    - {oid: .1.3.6.1.4.1.58833.1.2.2.4.3.7.0, yes: 2, label: перегрузка}
