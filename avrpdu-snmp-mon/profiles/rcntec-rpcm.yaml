# RCNTEC RPCM: an ATS with two inputs and a PDU with up to 10 switched outlets (RCNTEC-RPCM-MIB).
id: rcntec-rpcm
vendor: RCNTEC
model: RPCM
title: RCNTEC RPCM — АВР и управляемый PDU
kind: АВР
description: |
  Блок распределения питания для стойки со встроенным АВР (автоматическим вводом резерва).
  Два ввода питания: на каждом RPCM меряет напряжение, частоту, ток, мощность и энергию,
  следит за допуском и за правильностью фазы. Нагрузка всех розеток идёт от активного ввода;
  при пропадании или выходе за допуск АВР переключается на другой ввод.
  До 10 выходов (розеток): у каждого ток, активная, полная и реактивная мощность, энергия,
  защита от КЗ, перегрузки и перенапряжения. Выходы включаются и выключаются по SNMP.
  Своего замера напряжения на выходах нет: на них то, что даёт активный ввод.
links:
  - https://rcntec.com
match: [.1.3.6.1.4.1.46235.2]

