# Exagate SYSGuard (SYSG-7001 and the like): a rack monitoring controller with dry inputs, analog
# inputs, relay outputs and plug-in modules (temperature/humidity, mains VFE, input modules).
# exagate-V1.0.mib (enterprise 35483): one table of all the sensors by index: name, value, alarm
# state, scale (the divisor), unit as text. Firmware 24.0.8 does not give the V2 MIB.
# The indexes of the table are of this unit's set of modules; another set: a copy with its list.
# Read only here: the values (relays) and the thresholds are writable by SNMP, not done.
id: exagate-sysguard
vendor: Exagate
model: SYSGuard
title: Exagate SYSGuard — мониторинг стойки
kind: Контроллер датчиков
description: |
  Контроллер мониторинга стойки: сухие и аналоговые входы, релейные выходы и подключаемые модули
  (температура и влажность, контроль сети VFE, модули входов). У каждого датчика свои пороги
  предупреждения и аварии. Здесь по SNMP всё только читается.
links:
  - https://www.exagate.com
match: [.1.3.6.1.4.1.35483.1.1, .1.3.1.4.1.35483.1.1]   # firmware 24.0.8 gives .1.3.1.4.1.35483... (no .6)

system:
  model:    {oid: .1.3.6.1.4.1.35483.1.1.1.1.2.0, type: text}
  serial:   {oid: .1.3.6.1.4.1.35483.1.1.1.1.4.0, type: text}
  firmware: {oid: .1.3.6.1.4.1.35483.1.1.1.1.3.0, type: text}
  name:     {oid: .1.3.6.1.4.1.35483.1.1.1.1.1.0, type: text}
  location: {oid: .1.3.6.1.2.1.1.6.0, type: text}
  uptime:   {oid: .1.3.6.1.2.1.1.3.0, scale: 0.01}

# the relay outputs 5..8 (rows 5..8): the value 1 is on
outlets:
  title: Релейные выходы
  item: выход
  count: 4
  first: 5
  name: {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.3.{n}", type: text}
  on:   {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.4.{n}"}
  alarms:
    - {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.5.{n}", yes: 1, label: авария}
    - {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.5.{n}", yes: 2, label: критично}

# isAlarm: 0 normal, 1 alarm, 2 critical, 3 the sensor is not available (seen on the absent modules)
sensors:
  - title: Температура и влажность
    list: [25, 26, 27, 28, 48, 49]
    avail:  {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.7.{n}"}
    name:   {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.3.{n}", type: text}
    value:  {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.4.{n}"}
    div:    {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.15.{n}"}
    unit:   {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.16.{n}", type: text}
    status: {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.5.{n}", ok: 0, map: {1: авария, 2: критично, 3: нет связи}}
    na: [3]
  - title: Сеть (VFE)
    list: [29, 30, 31]
    avail:  {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.7.{n}"}
    name:   {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.3.{n}", type: text}
    value:  {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.4.{n}"}
    div:    {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.15.{n}"}
    unit:   {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.16.{n}", type: text}
    status: {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.5.{n}", ok: 0, map: {1: авария, 2: критично, 3: нет связи}}
    na: [3]
  - title: Сухие контакты
    list: [1, 2, 3, 4, 9, 10, 11, 12, 13, 14, 15, 16, 42, 43, 44, 45, 46, 47]
    avail:  {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.7.{n}"}
    name:   {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.3.{n}", type: text}
    value:  {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.4.{n}", map: {0: выкл, 1: вкл}}
    status: {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.5.{n}", ok: 0, map: {1: авария, 2: критично, 3: нет связи}}
    na: [3]
  - title: Аналоговые входы
    list: [17, 18, 19, 20, 21, 22, 23, 24]
    avail:  {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.7.{n}"}
    name:   {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.3.{n}", type: text}
    value:  {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.4.{n}"}
    div:    {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.15.{n}"}
    unit:   {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.16.{n}", type: text}
    status: {oid: ".1.3.6.1.4.1.35483.1.1.1.3.1.1.5.{n}", ok: 0, map: {1: авария, 2: критично, 3: нет связи}}
    na: [3]
