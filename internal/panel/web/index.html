<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>donoff panel</title>
<style>
:root {
  --bg: #f4f5f8; --card: #ffffff; --text: #1d2330; --muted: #687187; --line: #e1e4ea; --soft: #f0f2f6;
  --accent: #2563eb; --ok: #15803d; --bad: #c2410c; --warn: #a16207; --cool: #0284c7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --card: #1b2029; --text: #e3e7ee; --muted: #8b94a7; --line: #2b323e; --soft: #232a35;
    --accent: #6c9cff; --ok: #4ade80; --bad: #fb923c; --warn: #facc15; --cool: #38bdf8;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 18px; margin: 0; }
header .meta { color: var(--muted); font-size: 13px; }
header input { margin-left: auto; width: 200px; }
main { max-width: 1400px; margin: 0 auto; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card.stale { background: var(--soft); filter: grayscale(1); opacity: .75; }
.lost { margin: 2px 0 6px; font-size: 13px; color: var(--muted); }
.lost b { color: var(--text); }
.top { display: flex; align-items: center; gap: 8px; }
.top h2 { margin: 0; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.seen { color: var(--muted); font-size: 12px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.big { font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
.big small { font-size: 16px; color: var(--muted); font-weight: 500; }
.big .lbl { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; font-size: 13px; margin-top: 6px; }
.kv > span:nth-child(odd) { color: var(--muted); }
.kv > span { min-width: 0; overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; }
.relays { display: grid; gap: 6px; margin-top: 10px; }
.relay { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.relay .name { font-weight: 600; min-width: 34px; }
.pill { display: inline-flex; align-items: center; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1.5px solid currentColor; }
.pill.on { color: var(--cool); } .pill.off { color: var(--muted); }
.relay .t { color: var(--muted); font-size: 12px; }
.relay .acts { margin-left: auto; display: flex; gap: 4px; }
.btn { padding: 3px 10px; font: inherit; font-size: 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--text); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.on { color: var(--cool); border-color: var(--cool); } .btn.off { color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], input[type=search] { padding: 4px 8px; font: inherit; font-size: 13px; color: var(--text); background: var(--soft); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-size: 13px; user-select: none; }
.ctl { display: grid; gap: 8px; margin-top: 8px; }
.ctl .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ctl .row > label { color: var(--muted); font-size: 13px; width: 108px; }
.ctl input[type=number] { width: 80px; }
.ctl input[type=text] { flex: 1; }
.levels { font-size: 12px; color: var(--muted); }
.msgs { margin-top: 8px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 140px; overflow-y: auto; background: var(--soft); border-radius: 6px; padding: 4px 8px; }
.msgs div { white-space: pre-wrap; overflow-wrap: anywhere; }
.msgs .tm { color: var(--muted); }
.msgs .out { color: var(--accent); }
.msgs:empty { display: none; }
.con { display: flex; gap: 6px; align-items: center; }
.con .raw { flex: 1; min-width: 0; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
.last { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.4em; }
.last b { color: var(--text); font-weight: 500; }
.err { color: var(--bad); font-size: 12px; min-height: 1em; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.group { margin-bottom: 22px; }
.group > h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
.group > h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
.mode { margin-top: 8px; font-size: 13px; }
.mode b.heat { color: var(--bad); } .mode b.cool { color: var(--cool); } .mode .q { color: var(--muted); }
.ctl .rctl { display: flex; gap: 6px; flex-wrap: wrap; }
.other { font-size: 12px; }
.mdot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); opacity: .55; flex: none; align-self: center; }
.mdot.heat { background: #ea580c; opacity: 1; } .mdot.cool { background: #2563eb; opacity: 1; } .mdot.sched { background: #7c3aed; opacity: 1; } .mdot.none { visibility: hidden; }
.hbar { display: grid; grid-template-columns: repeat(24, 1fr); gap: 1px; margin: 2px 0 4px 19px; }
.hbar i { height: 8px; background: var(--soft); border-radius: 1px; }
.hbar i.on { background: #7c3aed; }
.hbar i.now { outline: 2px solid var(--text); outline-offset: 0; }
.hbar.big { margin: 4px 0; gap: 2px; }
.hbar.big i { height: 22px; font-style: normal; font-size: 10px; color: var(--muted); display: grid; place-items: center; cursor: default; user-select: none; }
.hbar.big i.on { color: #fff; }
.hbar.edit i { cursor: pointer; }
.hbar.edit i.chg { box-shadow: inset 0 0 0 2px #eab308; }
.hlab { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-left: 19px; }
.relay .cfg { margin-left: auto; font-variant-numeric: tabular-nums; }
.sync { font-size: 12px; } .sync.ok { color: var(--ok); } .sync.bad { color: var(--bad); }
.sch { display: grid; gap: 4px; }
.sch select { font: inherit; font-size: 13px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--text); max-width: 100%; }
.sch .q { color: var(--muted); font-size: 12px; }
.hbtn { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
.hbtn[hidden] { display: none; }
.hbtn .sp { flex: 1; min-width: 0; display: block; color: inherit; text-decoration: none; }
.hbtn svg { display: block; width: 100%; height: 38px; overflow: visible; }
.hbtn .sl { stroke: var(--accent); stroke-width: 1.6; fill: none; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.hbtn .sa { fill: var(--accent); opacity: .1; }
.hbtn .sc { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.hbtn .go { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); color: var(--text); text-decoration: none; font-size: 18px; }
.hbtn .go:hover { border-color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>donoff</h1>
  <span class="meta"><span class="dot" id="bdot"></span> <span id="broker">…</span></span>
  <span class="meta" id="count"></span>
  <input type="search" id="filter" placeholder="фильтр по устройству">
</header>
<main>
  <div id="groups"></div>
  <datalist id="grouplist"></datalist>
  <div class="empty" id="empty" hidden>Устройств пока нет — жду сообщений от брокера…</div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json' } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
let now = new Date();
const age = t => Math.max(0, (now - new Date(t)) / 1000);
const ago = t => { const s = Math.floor(age(t)); return s < 60 ? `${s} с` : s < 3600 ? `${Math.floor(s / 60)} мин` : s < 86400 ? `${Math.floor(s / 3600)} ч` : `${Math.floor(s / 86400)} д`; };
const hm = t => new Date(t).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

// topic kinds
const isTime = k => ['time_up', 'time_comm', 'time_down'].includes(k);
const relayKey = k => /^relays\/r\d+$/.test(k) || /^b\d+$/.test(k);
const sensorName = k => k.replace(/^sensors\//, '');
const isTemp = k => /^temp/.test(sensorName(k));
function primaryTemp(t) {
  for (const k of ['sensors/temp_in', 'temp_in', 'sensors/temp_out', 'temp_out']) if (t[k]) return [k, t[k]];
  const k = Object.keys(t).find(k => isTemp(k) && !k.endsWith('_json'));
  return k ? [k, t[k]] : null;
}
function deviceClock(t) {
  let best = null;
  for (const [k, v] of Object.entries(t)) {
    if (!v.v.startsWith('{')) continue;
    try { const j = JSON.parse(v.v); if (j.timestamp && (!best || v.at > best.at)) best = { ts: j.timestamp, at: v.at }; } catch (e) {}
  }
  return best;
}

async function send(dev, cmd, card, confirmText) {
  if (confirmText && !confirm(`${dev}: ${confirmText}\n\nКоманда: ${cmd}`)) return false;
  const err = card.querySelector('.err');
  try { await api('/api/v1/cmd', { method: 'POST', body: JSON.stringify({ dev, cmd }) }); err.textContent = ''; refresh(); return true; }
  catch (e) { err.textContent = e.message; return false; }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function askMode(id, el) { if (await send(id, 'sh hotter', el)) { await sleep(1200); send(id, 'sh cooler', el); } }

// "C=2600,D=..,N=.. dT=100" or the old EEPROM form "C=26,... dT=5": donoff-lib reads a level
// below 100 as °C and a delta below 50 as 1/10 °C, everything else as 1/100 °C
function parseLevels(text) {
  const C = +text.match(/C=(-?\d+)/)[1], dT = +text.match(/dT=(-?\d+)/)[1];
  return { c: Math.abs(C) < 100 ? C : C / 100, dt: (dT < 50 ? dT * 10 : dT) / 100 };
}

// the relay mode from the answers "hotter=N" / "cooler=N" (donoff-lib clears one when the other is set)
function relayMode(p) {
  const h = p.hotter, c = p.cooler;
  const hv = h && +h.v.split('=')[1], cv = c && +c.v.split('=')[1];
  if (h && hv > 0 && (!c || cv === 0 || h.at > c.at)) return { k: 'heat', t: 'термостат: нагрев' };
  if (c && cv > 0) return { k: 'cool', t: 'термостат: охлаждение' };
  if (h && c) return { k: 'manual', t: 'термостат не задан' };
  return null;
}

// "sh time": "I:S=1,T=17:5:2026" -> synced, the hour and the minute of the device
function devTime(p) {
  const m = p.time && p.time.v.match(/^I:S=(\d+),T=(\d+):(\d+)/);
  return m ? { synced: m[1] === '1', h: +m[2], m: +m[3], at: p.time.at } : null;
}

// the schedules of donoff-lib (lamp_modes): 24 hours, the first char is 00:00-00:59
const PRESETS = ['000000000000000000000000', '111111111111111111111111', '000000000000000000001111', '111111000000000000111111',
  '000000011111111111111110', '000001111111111111111110', '000000111100000000111110', '000011111000000000111110',
  '010101010101010101010101', '101010101010101010101010', '111111111111000000001111', '001001001001001001001001',
  '000100010001000100010001', '000010000100001000010001', '000000010000000100000001', '000000000010000000000001',
  '000000000000000000000010', '111111111110000000000011', '001111111111111000000000', '000000111100000000111111'];
const aofsNum = (p, n) => { const v = p['aofs' + n]; return v ? +v.v.split('=')[1] : null; };
const schNum = (p, n) => { const v = p['lschm' + n]; return v ? +v.v.split('=')[1] : null; };
const customBits = (p, n) => { const v = p['cschm' + n]; return v ? v.v.replace(/ /g, '') : null; };
function schBits(p, num) {
  if (num >= 1 && num <= PRESETS.length) return PRESETS[num - 1];
  if (num === 99) return customBits(p, 1);
  if (num === 100) return customBits(p, 2);
  return null;
}
function hoursText(bits) {
  if (!bits) return '';
  if (!bits.includes('1')) return 'всегда выкл';
  if (!bits.includes('0')) return 'всегда вкл';
  const out = []; let a = -1;
  for (let h = 0; h <= 24; h++) {
    if (h < 24 && bits[h] === '1') { if (a < 0) a = h; }
    else if (a >= 0) { out.push(a === h - 1 ? `${a}` : `${a}–${h - 1}`); a = -1; }
  }
  return out.length > 6 ? `${bits.split('').filter(x => x === '1').length} ч в сутки` : out.join(', ');
}
function schName(num) {
  if (num === 0) return 'выключено';
  if (num === 99) return 'своя схема 1 (cschm1)';
  if (num === 100) return 'своя схема 2 (cschm2)';
  return `пресет ${num}: ${hoursText(PRESETS[num - 1])}`;
}
function hbar(bits, now, big) {
  return `<div class="hbar${big ? ' big' : ''}">` + [...Array(24)].map((_, h) =>
    `<i class="${bits && bits[h] === '1' ? 'on' : ''}${h === now ? ' now' : ''}" data-h="${h}" title="${h}:00–${h}:59">${big ? h : ''}</i>`).join('') + '</div>';
}

// the small chart of temp_out for the last 24 h on the card, like the tiles of an exchange
const sparks = new Map(); // dev -> {at, busy}
async function spark(id, el) {
  const st = sparks.get(id) || {};
  if (st.busy || Date.now() - (st.at || 0) < 60000) return;
  sparks.set(id, { ...st, busy: true });
  try {
    const h = await api(`/api/v1/history?dev=${encodeURIComponent(id)}&range=24h`);
    // temp_out, or another temperature, or the current (sct013x3 is the sum of the three phases)
    const o = h.others || [];
    const s = h.temps.find(x => x.name === 'temp_out') || h.temps[0] || o.find(x => x.name === 'sct013x3') || o.find(x => /^sct|current/.test(x.name)) || o[0];
    const unit = !s ? '' : /^temp/.test(s.name) ? '°C' : /^sct|current/.test(s.name) ? 'А' : /power/.test(s.name) ? 'Вт' : /volt|volage/.test(s.name) ? 'В' : '';
    const box = el.querySelector('.spk'), cap = el.querySelector('.sc');
    if (!s || s.pts.length < 2) { box.innerHTML = ''; cap.innerHTML = s ? '<span>история копится…</span>' : ''; }
    else {
      const v = s.pts.map(p => p[1]), t0 = s.pts[0][0], t1 = s.pts[s.pts.length - 1][0];
      let lo = Math.min(...v), hi = Math.max(...v);
      const minSpan = unit === '°C' ? 0.5 : Math.max(Math.abs(hi + lo) / 2 * 0.05, 0.02);
      if (hi - lo < minSpan) { const m = (hi + lo) / 2; lo = m - minSpan / 2; hi = m + minSpan / 2; }
      const X = t => (t - t0) / Math.max(1, t1 - t0) * 200, Y = x => 36 - (x - lo) / (hi - lo) * 34;
      const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
      box.innerHTML = `<svg viewBox="0 0 200 38" preserveAspectRatio="none"><path class="sa" d="${d}L200,38L0,38Z"/><path class="sl" d="${d}"/></svg>`;
      const dt = v[v.length - 1] - v[0], hrs = Math.round((t1 - t0) / 3600);
      cap.innerHTML = `<span>${esc(s.name)} за ${hrs >= 1 ? hrs + ' ч' : Math.max(1, Math.round((t1 - t0) / 60)) + ' мин'}: ${dt >= 0 ? '+' : '−'}${Math.abs(dt).toFixed(2)} ${unit}</span><span>${Math.min(...v).toFixed(2)} … ${Math.max(...v).toFixed(2)}</span>`;
    }
    sparks.set(id, { at: Date.now() });
  } catch (e) { sparks.set(id, { at: Date.now() }); }
}

// the schedule controls in "Управление": a preset per relay, and the editor of the custom schemes
function schControls(id, el, relays, P, nowH) {
  const box = el.querySelector('.schctl'), n = Math.min(relays.length, 2);
  if (box.dataset.n !== String(n)) {
    box.dataset.n = n;
    const opts = [0, ...PRESETS.map((_, i) => i + 1), 99, 100].map(v => `<option value="${v}">${v === 0 ? '0 — выключено' : v >= 99 ? `${v} — ${schName(v)}` : `${v} — ${hoursText(PRESETS[v - 1])}`}</option>`).join('');
    box.innerHTML = [...Array(n)].map((_, i) => `
      <div class="row sch" data-n="${i + 1}"><label>Расписание ${esc(relays[i].replace(/^relays\//, ''))}</label>
        <span class="q cur"></span>
        <span style="display:flex;gap:6px;flex-wrap:wrap"><select>${opts}</select><button class="btn primary" data-a="sch">Задать</button></span>
        <div class="pv"></div>
        <span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="q">aofs (полив), с:</span><input type="number" class="ao" min="0" max="1200" step="1" style="width:80px"><button class="btn primary" data-a="aofs">Задать</button><span class="q aocur"></span></span>
        </div>`).join('') + (n ? `
      <details class="cust"><summary>Свои схемы (99 и 100)</summary>
        ${[1, 2].map(k => `<div class="sch" data-c="${k}"><span class="q">cschm${k}: <span class="cs"></span></span>
          <div class="ed"></div><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-a="cload">загрузить с устройства</button><button class="btn primary" data-a="csave">сохранить часы</button><button class="btn" data-a="creset">отменить правки</button></span></div>`).join('')}
        <div class="q">Клик по часу меняет его; «сохранить» отправит только изменённые часы командами cschmN=час:0|1.</div>
      </details>` : '');
    box.querySelectorAll('select').forEach(sel => sel.addEventListener('change', () => { sel.dataset.dirty = '1'; schControls(id, el, relays, cardParams.get(id) || {}, nowH); }));
    box.addEventListener('click', async e => {
      const P = cardParams.get(id) || {};
      const cell = e.target.closest('.ed i');
      if (cell) {
        const k = cell.closest('[data-c]').dataset.c, ed = edits.get(id + k) || customBits(P, k);
        if (!ed) return;
        const h = +cell.dataset.h, nb = ed.slice(0, h) + (ed[h] === '1' ? '0' : '1') + ed.slice(h + 1);
        edits.set(id + k, nb); schControls(id, el, relays, P, nowH); return;
      }
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.a === 'sch') {
        const row = b.closest('[data-n]'), k = row.dataset.n, sel = row.querySelector('select'), v = +sel.value;
        const warn = k === '1' && v > 0 ? '\nТермостат (hotter/cooler) и aofh на этом реле устройство выключит.' : v === 0 ? '\nРеле выключится.' : '';
        const par = k === '1' ? 'lschm' : 'lschm2'; // the old firmware knows "lschm", not "lschm1"
        if (await send(id, `${par}=${v}`, el, `расписание реле ${k}: ${schName(v)}?${warn}`)) {
          sel.dataset.dirty = ''; await sleep(1200); await send(id, `sh ${par}`, el);
          if (v >= 99) { await sleep(1200); send(id, `sh cschm${v - 98}`, el); }
        }
        return;
      }
      if (b.dataset.a === 'aofs') {
        const row = b.closest('[data-n]'), k = row.dataset.n, inp = row.querySelector('.ao'), v = Number(inp.value);
        if (inp.value === '' || !Number.isInteger(v) || v < 0 || v > 1200) { el.querySelector('.err').textContent = 'aofs: целое число секунд 0…1200'; return; }
        const par = k === '1' ? 'aofs' : 'aofs2';
        const what = v === 0 ? 'выключить (реле по расписанию держится весь час)' : `${v} с в начале каждого часа расписания` + (k === '1' ? ';\nручное включение r1 без термостата тоже выключится через ' + v + ' с' : ';\nлюбое включение r2 выключится через ' + v + ' с');
        if (await send(id, `${par}=${v}`, el, `реле ${k}, aofs: ${what}?`)) { inp.dataset.dirty = ''; await sleep(1200); send(id, `sh ${par}`, el); }
        return;
      }
      const c = b.closest('[data-c]'); if (!c) return;
      const k = c.dataset.c;
      if (b.dataset.a === 'cload') return send(id, `sh cschm${k}`, el);
      if (b.dataset.a === 'creset') { edits.delete(id + k); schControls(id, el, relays, P, nowH); return; }
      if (b.dataset.a === 'csave') {
        const was = customBits(P, k), ed = edits.get(id + k);
        if (!was || !ed) return;
        const ch = [...Array(24)].map((_, h) => h).filter(h => was[h] !== ed[h]);
        if (!ch.length) return;
        if (!confirm(`${id}: изменить свою схему ${k} (cschm${k})?\n\n` + ch.map(h => `${h}:00 — ${ed[h] === '1' ? 'вкл' : 'выкл'}`).join('\n'))) return;
        for (const h of ch) { if (!await send(id, `cschm${k}=${h}:${ed[h]}`, el)) return; await sleep(1200); }
        edits.delete(id + k); send(id, `sh cschm${k}`, el);
      }
    });
  }
  cardParams.set(id, P);
  box.querySelectorAll('[data-n]').forEach(row => {
    const k = +row.dataset.n, cur = schNum(P, k), sel = row.querySelector('select');
    if (!sel.dataset.dirty && document.activeElement !== sel && cur !== null) sel.value = String(cur);
    row.querySelector('.cur').textContent = cur === null ? 'сейчас: неизвестно (опрос раз в минуту)' : `сейчас: ${schName(cur)}`;
    const ao = aofsNum(P, k), inp = row.querySelector('.ao');
    if (!inp.dataset.bound) { inp.dataset.bound = '1'; inp.addEventListener('input', () => { inp.dataset.dirty = '1'; }); }
    if (!inp.dataset.dirty && document.activeElement !== inp && ao !== null) inp.value = ao;
    row.querySelector('.aocur').textContent = ao === null ? 'сейчас: неизвестно' : `сейчас: ${ao}${ao ? ' с' : ' (весь час)'}`;
    const v = +sel.value, bits = schBits(P, v);
    row.querySelector('.pv').innerHTML = v === 0 ? '' : bits ? hbar(bits, nowH, true) : '<span class="q">часы своей схемы ещё не загружены</span>';
  });
  box.querySelectorAll('[data-c]').forEach(c => {
    const k = c.dataset.c, was = customBits(P, k), ed = edits.get(id + k) || was;
    c.querySelector('.cs').textContent = was ? hoursText(was) + (edits.has(id + k) ? ' → ' + hoursText(ed) + ' (не сохранено)' : '') : 'не загружена';
    const html = ed ? hbar(ed, nowH, true).replace('class="hbar big"', 'class="hbar big edit"') : '';
    const e = c.querySelector('.ed');
    const marked = was && ed ? html.replace(/data-h="(\d+)"/g, (m0, h) => was[h] !== ed[h] ? `${m0} data-chg` : m0) : html;
    if (e.dataset.html !== marked) { e.innerHTML = marked; e.dataset.html = marked; e.querySelectorAll('[data-chg]').forEach(x => x.classList.add('chg')); }
  });
}
const edits = new Map(), cardParams = new Map();

const cards = new Map(), sections = new Map();
let groups = {}, hasHistory = false;
function makeCard(id) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="live"></div>
    <div class="hbtn" hidden><a class="sp hlink"><div class="spk"></div><div class="sc"></div></a><a class="go hlink" title="все графики">›</a></div>
    <details>
      <summary>Управление</summary>
      <div class="ctl">
        <div class="con"><input type="text" class="raw" placeholder="команда, Enter — отправить (↑ — прошлые)" autocomplete="off" spellcheck="false" autocapitalize="off"><button class="btn" data-a="raw">⏎</button></div>
        <div class="last" title="последний ответ в /out/info"></div>
        <div class="levels"></div>
        <div class="row"><label>Реле</label><span class="rctl"></span></div>
        <div class="row"><label>Уставка, °C</label><input type="number" class="sp" step="0.5" min="-40" max="100"><button class="btn primary" data-a="sp">Задать</button></div>
        <div class="row"><label>Гистерезис, °C</label><input type="number" class="hy" step="0.1" min="0" max="20"><button class="btn primary" data-a="hy">Задать</button></div>
        <div class="schctl"></div>
        <div class="row"><label>Режим</label><button class="btn" data-a="cool">❄ Охлаждение</button><button class="btn" data-a="heat">🔥 Нагрев</button><button class="btn" data-a="autooff">Выкл авто</button></div>
        <div class="row"><label>Запросить</label><button class="btn" data-q="sh tlevels">уставки</button><button class="btn" data-a="askmode">режим</button><button class="btn" data-q="sh time">время</button><button class="btn" data-q="sh ip">ip</button></div>
        <div class="row"><label>Группа</label><input type="text" class="grp" list="grouplist" placeholder="без группы"><button class="btn" data-a="grp">Сохранить</button></div>
      </div>
    </details>
    <div class="err"></div>
    <div class="msgs"></div>`;
  el.querySelector('.ctl').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.q) return send(id, b.dataset.q, el);
    const a = b.dataset.a;
    if (a === 'sp') { const v = parseFloat(el.querySelector('.sp').value); if (!isFinite(v)) return; return send(id, `ctempl=${Math.round(v * 100)}`, el, `уставка ${v} °C?`); }
    if (a === 'hy') { const v = parseFloat(el.querySelector('.hy').value); if (!isFinite(v)) return; return send(id, `tdelta=${Math.round(v * 100)}`, el, `гистерезис ${v} °C?`); }
    if (b.dataset.r) { const n = b.dataset.r, on = b.dataset.v === '1'; return send(id, `r${n}${on ? 1 : 0}`, el, `${on ? 'ВКЛЮЧИТЬ' : 'ВЫКЛЮЧИТЬ'} реле r${n}?`); }
    if (a === 'askmode') return askMode(id, el);
    if (a === 'cool') { if (await send(id, 'cooler=1', el, 'включить режим ОХЛАЖДЕНИЯ?')) { await sleep(1200); askMode(id, el); } return; }
    if (a === 'heat') { if (await send(id, 'hotter=1', el, 'включить режим НАГРЕВА?')) { await sleep(1200); askMode(id, el); } return; }
    if (a === 'autooff') { if (await send(id, 'hotter=0', el, 'выключить автоматику (hotter=0, затем cooler=0)? Реле выключится.')) { await sleep(1200); if (await send(id, 'cooler=0', el)) { await sleep(1200); askMode(id, el); } } return; }
    if (a === 'grp') {
      try { await api('/api/v1/group', { method: 'PUT', body: JSON.stringify({ dev: id, group: el.querySelector('.grp').value }) }); el.querySelector('.grp').dataset.dirty = ''; el.querySelector('.err').textContent = ''; refresh(); }
      catch (e) { el.querySelector('.err').textContent = e.message; }
      return;
    }
    if (a === 'raw') return rawSend();
  });
  // the command line: "sh ..." goes at once, a setting asks first; ↑/↓ walk the commands sent from this card
  const raw = el.querySelector('.raw'), hist = []; let hi = 0;
  async function rawSend() {
    const c = raw.value.trim(); if (!c) return;
    if (await send(id, c, el, /^sh\s/i.test(c) ? '' : 'отправить команду?')) {
      if (hist[hist.length - 1] !== c) hist.push(c);
      hi = hist.length; raw.value = '';
    }
  }
  raw.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); rawSend(); }
    else if (e.key === 'ArrowUp' && hi > 0) { e.preventDefault(); raw.value = hist[--hi]; }
    else if (e.key === 'ArrowDown' && hi < hist.length) { e.preventDefault(); hi++; raw.value = hist[hi] || ''; }
  });
  el.querySelectorAll('.hlink').forEach(a => a.href = '/history?dev=' + encodeURIComponent(id));
  el.querySelector('.grp').addEventListener('input', e => { e.target.dataset.dirty = '1'; });
  cards.set(id, el);
  return el;
}

function render(d) {
  d.info = d.info || []; d.log = d.log || []; d.topics = d.topics || {};
  const el = cards.get(d.id) || makeCard(d.id);
  const t = d.topics, a = age(d.last_seen);
  el.classList.toggle('stale', a > 300);
  const dot = a < 60 ? 'ok' : a < 300 ? 'warn' : '';
  const pt = primaryTemp(t);
  const clock = deviceClock(t);
  const relays = Object.keys(t).filter(relayKey).sort();
  const sensors = Object.keys(t).filter(k => !isTime(k) && !relayKey(k) && !k.endsWith('_json') && !t[k].v.startsWith('{') && (!pt || k !== pt[0])).sort();
  const rows = [];
  if (t.time_up) rows.push(['Время работы', `<span class="num">${esc(t.time_up.v)}</span>`]);
  const dt = devTime(d.params || {});
  const syncHtml = dt ? (dt.synced ? ' <span class="sync ok" title="sh time: S=1">✓ синхр.</span>' : ' <span class="sync bad" title="sh time: S=0 — расписания, кроме 1 и 2, не работают">⚠ время не синхронизировано</span>') : '';
  if (clock) rows.push(['Часы устройства', `<span class="num">${esc(clock.ts)}</span>${syncHtml}`]);
  else if (dt) rows.push(['Часы устройства', `<span class="num">${dt.h}:${String(dt.m).padStart(2, '0')}</span>${syncHtml}`]);
  for (const k of sensors) rows.push([esc(sensorName(k)), `<span class="num">${esc(t[k].v)}</span>`]);
  // the thermostat relay (the first one) gets a dot: orange = heating, blue = cooling, gray = no thermostat
  // a relay on a schedule (lschm1 for the first, lschm2 for the second) gets a violet dot and the bar of 24 hours
  const P = d.params || {};
  const m = relays.length ? relayMode(P) : null;
  const mdot = m ? { heat: ['heat', 'термостат: нагрев'], cool: ['cool', 'термостат: охлаждение'], manual: ['', 'термостат не задан'] }[m.k] : ['', 'режим ещё неизвестен'];
  const nowH = dt && dt.synced ? (dt.h + Math.floor((dt.m + age(dt.at) / 60) / 60)) % 24 : new Date().getHours();
  const relayHtml = relays.map((k, i) => {
    const on = t[k].v === '1', n = (k.match(/^relays\/r(\d+)$/) || [])[1];
    let tm = '';
    if (k === 'relays/r1') {
      if (on && t.time_comm && t.time_comm.v !== 'OFF') tm = `вкл ${esc(t.time_comm.v)}`;
      if (!on && t.time_down && t.time_down.v !== 'OFF') tm = `выкл ${esc(t.time_down.v)}`;
    }
    const sn = i < 2 ? schNum(P, i + 1) : null, sched = sn > 0;
    const dd = sched ? ['sched', 'по часам: ' + schName(sn)] : i === 0 ? mdot : ['none', ''];
    const bar = sched ? hbar(schBits(P, sn), nowH) : '';
    const ao = i < 2 ? aofsNum(P, i + 1) : null, q = x => x === null ? '?' : x;
    const cfg = i < 2 ? `<span class="t cfg" title="lschm — расписание по часам, aofs — сколько секунд реле включено в начале часа (полив), 0 — весь час">lschm ${q(sn)} · aofs ${q(ao)}${ao > 0 ? ' с' : ''}</span>` : '';
    return `<div class="relay"><span class="mdot ${dd[0]}" title="${esc(dd[1])}"></span><span class="name">${esc(k.replace(/^relays\//, ''))}</span><span class="pill ${on ? 'on' : 'off'}">${on ? 'ВКЛ' : 'ВЫКЛ'}</span><span class="t">${tm}${sched ? ` · по часам${ao > 0 ? `, полив ${ao} с в начале часа` : ''}` : ''}</span>${cfg}</div>${bar}`;
  }).join('');
  el.querySelector('.live').innerHTML = `
    <div class="top"><span class="dot ${dot}"></span><h2>${esc(d.id)}</h2><span class="seen">${ago(d.last_seen)} назад</span></div>
    ${a > 300 ? `<div class="lost"><b>Нет связи</b> · последний раз ${new Date(d.last_seen).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })} (${ago(d.last_seen)} назад)</div>` : ''}
    ${pt ? `<div class="big">${esc(pt[1].v)} <small>°C</small><span class="lbl">${esc(sensorName(pt[0]))}</span></div>` : ''}
    ${rows.length ? `<div class="kv">${rows.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('')}</div>` : ''}
    ${relayHtml ? `<div class="relays">${relayHtml}</div>` : ''}
`;
  const rctl = relays.map(k => (k.match(/^relays\/r(\d+)$/) || [])[1]).filter(Boolean)
    .map(n => `<button class="btn on" data-r="${n}" data-v="1">r${n} вкл</button><button class="btn off" data-r="${n}" data-v="0">r${n} выкл</button>`).join('');
  const rbox = el.querySelector('.rctl');
  if (rbox.dataset.html !== rctl) { rbox.innerHTML = rctl || '<span class="q">реле нет</span>'; rbox.dataset.html = rctl; }
  schControls(d.id, el, relays, P, nowH);
  el.querySelector('.hbtn').hidden = !(hasHistory && (relays.length || sensors.length || pt));
  if (hasHistory) spark(d.id, el);
  const g = el.querySelector('.grp');
  if (!g.dataset.dirty && document.activeElement !== g) g.value = groups[d.id] || '';
  // the last answer with levels: "C=2600,D=2600,N=2600 dT=100"
  const lv = P.tls;
  el.querySelector('.levels').textContent = lv
    ? (() => { const l = parseLevels(lv.v); return `Сейчас: уставка ${l.c} °C, гистерезис ${l.dt} °C (ответ ${ago(lv.at)} назад)`; })()
    : 'Текущие уставки неизвестны — панель спрашивает их раз в минуту, или «Запросить: уставки».';
  const msgs = [...d.info.filter(m => !m.auto).map(m => ({ ...m, k: 'i' })), ...d.log.map(m => ({ ...m, k: 'l' }))].sort((x, y) => x.at < y.at ? -1 : 1).slice(-12);
  const lastIn = d.info.filter(m => !m.out).slice(-1)[0];
  const lastHtml = lastIn ? `<span>${hm(lastIn.at)}</span> ← <b>${esc(lastIn.text)}</b>` : 'ответов ещё нет';
  const le = el.querySelector('.last');
  if (le.dataset.html !== lastHtml) { le.innerHTML = lastHtml; le.dataset.html = lastHtml; le.title = lastIn ? lastIn.text : ''; }
  const box = el.querySelector('.msgs');
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
  box.innerHTML = msgs.map(m => `<div><span class="tm">${hm(m.at)}</span> ${m.out ? `<span class="out">→ ${esc(m.text)}</span>` : (m.k === 'l' ? 'log: ' : '') + esc(m.text)}</div>`).join('');
  if (atBottom) box.scrollTop = box.scrollHeight;
  return el;
}

async function refresh() {
  let s;
  try { s = await api('/api/v1/state'); } catch (e) { $('bdot').className = 'dot bad'; $('broker').textContent = 'нет связи с панелью: ' + e.message; return; }
  now = new Date(s.now);
  $('bdot').className = 'dot ' + (s.broker.connected ? 'ok' : 'bad');
  $('broker').textContent = `${s.broker.user}@${s.broker.server}` + (s.broker.connected ? '' : ' — ' + (s.broker.error || 'подключение…'));
  const f = $('filter').value.trim().toLowerCase();
  const devs = (s.devices || []).filter(d => !f || d.id.toLowerCase().includes(f));
  $('count').textContent = `устройств: ${(s.devices || []).length}`;
  groups = s.groups || {};
  hasHistory = !!s.history;
  const names = [...new Set(Object.values(groups))].sort((x, y) => x.localeCompare(y, 'ru'));
  $('grouplist').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
  const by = new Map(names.map(n => [n, []]));
  by.set('', []);
  for (const d of devs) by.get(groups[d.id] && by.has(groups[d.id]) ? groups[d.id] : '').push(d);
  const order = [...names, ''].filter(n => by.get(n).length);
  const root = $('groups');
  const wantSec = order.map(n => {
    let sec = sections.get(n);
    if (!sec) {
      sec = document.createElement('section'); sec.className = 'group';
      sec.innerHTML = '<h2><span class="gname"></span> <small></small></h2><div class="grid"></div>';
      sections.set(n, sec);
    }
    const list = by.get(n);
    sec.querySelector('.gname').textContent = n || (names.length ? 'Без группы' : 'Устройства');
    sec.querySelector('small').textContent = list.length;
    const grid = sec.querySelector('.grid');
    const want = list.map(render);
    [...grid.children].forEach(c => { if (!want.includes(c)) c.remove(); });
    want.forEach((c, i) => { if (grid.children[i] !== c) grid.insertBefore(c, grid.children[i] || null); });
    return sec;
  });
  [...root.children].forEach(c => { if (!wantSec.includes(c)) c.remove(); });
  wantSec.forEach((c, i) => { if (root.children[i] !== c) root.insertBefore(c, root.children[i] || null); });
  $('empty').hidden = devs.length > 0;
}

$('filter').addEventListener('input', refresh);
refresh(); setInterval(refresh, 2000);
</script>
