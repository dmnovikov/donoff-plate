# Raritan PX2/PX3/PX4 (PDU2-MIB 4.3.15, enterprise 13742): a PDU with metered and switched outlets,
# over-current protectors (breakers) and external sensors. Every reading is a row of a sensor table
# by the sensor type (1 current, 4 voltage, 5 power, 6 VA, 8 energy, 14 on/off, 15 trip, 23 Hz);
# the decimal digits of each type are the device's own (here: the PX3-5493V-K2).
# This profile (raritan-px2): PX2-2070LER, PX2-2190R: the inlet current has 1 digit (A x10), the outlets
# are switched but not metered. Not by sysObjectID (the same as PX3): give profile: raritan-px2.
# Read only here: the outlets can be switched by SNMP (outletSwitchControlTable), not done.
id: raritan-px2
vendor: Raritan
model: PX2
title: Raritan PX2 — PDU
kind: PDU (ПДУ)
description: |
  Блок распределения питания для стойки Raritan серии PX (PX2, PX3, PX4).
  На вводе и на каждой розетке меряет напряжение, ток, мощность и энергию, у розеток есть реле.
  Розетки разбиты на группы с автоматами. К PDU подключаются внешние датчики (температура,
  влажность, точка росы и др.). Здесь по SNMP всё только читается.
links:
  - https://www.raritan.com
match: []   # chosen by the config

alarms:
  # the trip sensor (15) of the breakers: 1 closed (normal); an absent breaker is no alarm
  - {oid: .1.3.6.1.4.1.13742.6.5.3.3.1.3.1.1.15, ok: 1, label: сработал автомат 1}
  - {oid: .1.3.6.1.4.1.13742.6.5.3.3.1.3.1.2.15, ok: 1, label: сработал автомат 2}
  - {oid: .1.3.6.1.4.1.13742.6.5.3.3.1.3.1.3.15, ok: 1, label: сработал автомат 3}

system:
  model:    {oid: .1.3.6.1.4.1.13742.6.3.2.1.1.3.1, type: text}
  serial:   {oid: .1.3.6.1.4.1.13742.6.3.2.1.1.4.1, type: text}
  firmware: {oid: .1.3.6.1.2.1.1.1.0, type: text}
  name:     {oid: .1.3.6.1.4.1.13742.6.3.2.2.1.13.1, type: text}   # pduName (sysName is often empty)
  location: {oid: .1.3.6.1.2.1.1.6.0, type: text}
  uptime:   {oid: .1.3.6.1.2.1.1.3.0, scale: 0.01}

ats:
  title: Ввод питания
  inputs_oid: {oid: .1.3.6.1.4.1.13742.6.3.2.2.1.2.1}   # inletCount

# measurementsInletSensorValue.pdu.inlet.type
input:
  v:   {oid: ".1.3.6.1.4.1.13742.6.5.2.3.1.4.1.{n}.4"}
  ma:  {oid: ".1.3.6.1.4.1.13742.6.5.2.3.1.4.1.{n}.1", scale: 100}    # 1 digit: A x10 -> mA
  w:   {oid: ".1.3.6.1.4.1.13742.6.5.2.3.1.4.1.{n}.5"}
  hz:  {oid: ".1.3.6.1.4.1.13742.6.5.2.3.1.4.1.{n}.23", scale: 0.1}
  kwh: {oid: ".1.3.6.1.4.1.13742.6.5.2.3.1.4.1.{n}.8", scale: 0.001}  # Wh
  alarms:
    # the sensor state: 4 normal, 2/3 below, 5/6 above the thresholds
    - {oid: ".1.3.6.1.4.1.13742.6.5.2.3.1.3.1.{n}.4", ok: 4, label: напряжение вне нормы}
    - {oid: ".1.3.6.1.4.1.13742.6.5.2.3.1.3.1.{n}.1", ok: 4, label: ток вне нормы}

outlets:
  count_oid: {oid: .1.3.6.1.4.1.13742.6.3.2.2.1.4.1}   # outletCount
  first: 1
  name: {oid: ".1.3.6.1.4.1.13742.6.3.5.3.1.3.1.{n}", type: text}
  on:   {oid: ".1.3.6.1.4.1.13742.6.5.4.3.1.3.1.{n}.14", yes: 7}   # 7 on, 8 off

sensors:
  # the external sensors by their ID: up to 64, the first 16 are read; the absent ones are not shown
  - title: Датчики
    count: 16
    first: 1
    avail:   {oid: ".1.3.6.1.4.1.13742.6.5.5.3.1.2.1.{n}"}                # TruthValue: 1 true
    name:    {oid: ".1.3.6.1.4.1.13742.6.3.6.3.1.4.1.{n}", type: text}
    value:   {oid: ".1.3.6.1.4.1.13742.6.5.5.3.1.4.1.{n}"}
    digits:  {oid: ".1.3.6.1.4.1.13742.6.3.6.3.1.17.1.{n}"}
    unit:    {oid: ".1.3.6.1.4.1.13742.6.3.6.3.1.16.1.{n}", map: {1: В, 2: А, 3: Вт, 4: ВА, 7: °C, 8: Гц, 9: "%", 10: м/с, 11: Па, 21: лк, 22: г/м³}}
    vstatus: {oid: ".1.3.6.1.4.1.13742.6.5.5.3.1.3.1.{n}", ok: 4, map: {-1: нет данных, 2: ниже критического, 3: ниже нормы, 5: выше нормы, 6: выше критического}}
