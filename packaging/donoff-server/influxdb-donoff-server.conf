# donoff-server: InfluxDB on a board with 512 MB (NAPI-C): small caches, no reporting home.
[Service]
# its start script waits for /ready forever when influxd cannot start (the port is taken)
TimeoutStartSec=120
Environment=INFLUXD_REPORTING_DISABLED=true
Environment=INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE=33554432
Environment=INFLUXD_STORAGE_CACHE_SNAPSHOT_MEMORY_SIZE=8388608
Environment=INFLUXD_QUERY_CONCURRENCY=4
Environment=INFLUXD_QUERY_QUEUE_SIZE=16
Environment=GOMEMLIMIT=160MiB
